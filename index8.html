/* ---------- STUDENT DASHBOARD ---------- */
Views.studentDashboard = ()=>{
  const sess = Auth.current();
  const stu = DB.find('students', sess.id);
  if(!stu){ toast('Student record missing.','error'); Auth.logout(); return; }
  // Exams visible to this student's class
  const exams = DB.findWhere('exams', e=> e.class_id===stu.class_id);
  const now = Date.now();
  const byStatus = (e)=>{
    const att = DB.firstWhere('attempts', a=> a.exam_id===e.id && a.student_id===stu.id);
    if(att && att.status==='IN_PROGRESS') return 'in_progress';
    if(att && ['SUBMITTED','AWAITING_MARKING','MARKED','APPROVED'].includes(att.status)) return 'awaiting';
    if(att && att.status==='PUBLISHED') return 'published';
    if(att && att.status==='REJECTED') return 'rejected';
    if(e.status!=='PUBLISHED') return 'draft';
    if(now < new Date(e.opens_at).getTime()) return 'upcoming';
    if(now > new Date(e.closes_at).getTime()) return 'closed';
    return 'available';
  };
  const card = (e)=>{
    const st = byStatus(e);
    const att = DB.firstWhere('attempts', a=> a.exam_id===e.id && a.student_id===stu.id);
    const badge = {
      available:['badge-green','Available'],
      upcoming:['badge-blue','Upcoming'],
      in_progress:['badge-yellow','In progress'],
      awaiting:['badge-yellow','Awaiting approval'],
      published:['badge-green','Results published'],
      rejected:['badge-red','Rejected'],
      closed:['badge-gray','Closed'],
      draft:['badge-gray','Not published']
    }[st];
    let action='';
    if(st==='available') action=`<a href="#/exam/start/${e.id}" class="btn btn-primary btn-sm">Start examination</a>`;
    else if(st==='in_progress') action=`<a href="#/exam/take/${att.id}" class="btn btn-warn btn-sm">Resume</a>`;
    else if(st==='published') action=`<a href="#/result/${att.id}" class="btn btn-ghost btn-sm">View results</a>`;
    else if(st==='awaiting') action=`<span class="t-muted t-small">Awaiting teacher approval</span>`;
    return `<div class="card hover">
      <div class="flex-between">
        <h3>${escapeHtml(e.title)}</h3>
        <span class="badge ${badge[0]}">${badge[1]}</span>
      </div>
      <div class="sub mb1">${escapeHtml(e.subject)} · ${escapeHtml(clsName(e.class_id))} · ${escapeHtml(e.category)}</div>
      <div class="t-small t-muted">
        Opens: ${fmtDate(e.opens_at)}<br>
        Duration: ${e.duration_minutes} min · Total: ${e.total_marks} marks · Pass: ${e.pass_mark||'—'}
      </div>
      <div class="mt1">${action}</div>
    </div>`;
  };
  const avail = exams.filter(e=>byStatus(e)==='available');
  const inProg = exams.filter(e=>byStatus(e)==='in_progress');
  const upcoming = exams.filter(e=>byStatus(e)==='upcoming');
  const awaiting = exams.filter(e=>byStatus(e)==='awaiting');
  const published = exams.filter(e=>byStatus(e)==='published');

  Views.shell(`
    <div class="page">
      <div class="card mb2" style="background:linear-gradient(135deg,var(--coral),var(--sun));color:#fff;border:none">
        <div class="flex-between">
          <div>
            <div class="t-tiny" style="opacity:.85">Welcome / Karibu</div>
            <h2 style="margin:.2rem 0;color:#fff">${escapeHtml(stu.name)}</h2>
            <div style="opacity:.9">Admission ${escapeHtml(stu.admission_number)} · ${escapeHtml(clsName(stu.class_id))}</div>
          </div>
          <div class="avatar" style="width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.4rem">${initials(stu.name)}</div>
        </div>
      </div>

      ${inProg.length?`<h3 class="mb1">Continue examination</h3><div class="grid grid-2 mb2">${inProg.map(card).join('')}</div>`:''}
      ${avail.length?`<h3 class="mb1">Available now</h3><div class="grid grid-2 mb2">${avail.map(card).join('')}</div>`:''}
      ${upcoming.length?`<h3 class="mb1">Upcoming</h3><div class="grid grid-2 mb2">${upcoming.map(card).join('')}</div>`:''}
      ${awaiting.length?`<h3 class="mb1">Awaiting teacher approval</h3><div class="grid grid-2 mb2">${awaiting.map(card).join('')}</div>`:''}
      ${published.length?`<h3 class="mb1">Results published</h3><div class="grid grid-2 mb2">${published.map(card).join('')}</div>`:''}

      ${!exams.length?`<div class="empty"><div class="ico">📭</div><h3>No examinations yet</h3><p>When your teacher publishes an examination, it will appear here.</p></div>`:''}
    </div>`);
};

/* ---------- EXAM START (pre-flight) ---------- */
Views.examStart = (examId)=>{
  const sess = Auth.current();
  const exam = DB.find('exams', examId);
  if(!exam){ toast('Examination not found.','error'); return; }
  if(exam.class_id !== sess.class_id){ toast('This examination is not assigned to your class.','error'); return; }
  // Existing attempt?
  const existing = DB.firstWhere('attempts', a=> a.exam_id===examId && a.student_id===sess.id && a.status==='IN_PROGRESS');
  if(existing) Exam._restoreProgress(existing);
  const remaining = existing? Timer.remaining(existing.id) : null;

  Views.shell(`
    <div class="page-narrow">
      <div class="card">
        <h2>${escapeHtml(exam.title)}</h2>
        <div class="sub mb2">${escapeHtml(exam.subject)} · ${escapeHtml(clsName(exam.class_id))} · ${escapeHtml(exam.category)}</div>
        <div class="grid grid-2 mb2">
          <div class="stat"><div class="v">${exam.duration_minutes}</div><div class="l">Minutes</div></div>
          <div class="stat"><div class="v">${exam.total_marks}</div><div class="l">Total marks</div></div>
          <div class="stat"><div class="v">${DB.findWhere('questions',q=>q.exam_id===examId).length}</div><div class="l">Questions</div></div>
          <div class="stat"><div class="v">${exam.pass_mark||'—'}</div><div class="l">Pass mark</div></div>
        </div>
        <div class="alert alert-info">
          <b>Instructions:</b><br>${escapeHtml(exam.instructions)}
        </div>
        <div class="alert alert-warn">
          <b>Timing policy:</b> ${exam.timing_policy==='ELAPSED'
            ? 'Elapsed-time examination.'
            : 'Active-session examination.'}
          Either way, if your phone dies, your browser closes, or the internet drops, just sign back in — the timer pauses while you are away and your saved answers are waiting. You will resume exactly where you left off.
        </div>
        <div class="alert alert-info">
          <b>Your answers are saved automatically</b> as you type. If your phone dies, your browser closes, or the internet drops, sign in again and resume — your saved answers will still be there.
        </div>
        ${existing? `<div class="alert alert-warn"><b>You have an examination in progress.</b> Remaining time: <b>${Timer.fmt(remaining)}</b>. Resuming will continue this attempt.</div>`:''}
        <div class="row mt2">
          <a href="#/dashboard" class="btn btn-ghost">Back</a>
          <button class="btn btn-primary" onclick="Views._examGo('${examId}')">${existing?'Resume examination':'Start examination'}</button>
        </div>
      </div>
    </div>`);
};
Views._examGo = async (examId)=>{
  const res = await Exam.startAttempt(examId, Auth.current().id);
  if(!res.ok){ toast(res.msg,'error'); return; }
  location.hash = `#/exam/take/${res.attempt.id}`;
};

/* ---------- EXAM TAKE ---------- */
Views.examTake = (attemptId)=>{
  const att = DB.find('attempts', attemptId);
  if(!att){ toast('Attempt not found.','error'); return; }
  if(att.student_id !== Auth.current().id){ toast('This is not your examination.','error'); return; }
  if(att.status!=='IN_PROGRESS'){
    if(att.status==='SUBMITTED'||att.status==='AWAITING_MARKING'||att.status==='MARKED'||att.status==='APPROVED'||att.status==='PUBLISHED'){
      location.hash = `#/result/${att.id}`; return;
    }
    toast('This examination can no longer be taken.','warn'); location.hash='#/dashboard'; return;
  }
  // Active-session resume: restore persisted remaining time (pause-on-close).
  Exam._restoreProgress(att);
  // Only auto-submit when the student has genuinely used all their active time
  // AND actually attempted the paper. A zero-answer attempt whose time reads 0
  // almost always means a disconnect before any work — restore a fresh session
  // so a young learner is never locked out of an exam they never really sat.
  if(Timer.remaining(att.id) <= 0){
    const answered = DB.findWhere('answers', a=> a.attempt_id===att.id && a.value!==null && a.value!==undefined && a.value!=='').length;
    if(answered > 0){
      Exam.autoSubmit(att.id, 'TIME_EXPIRED');
      toast('Time has expired. Your examination has been submitted automatically.','warn');
      location.hash = `#/result/${att.id}`; return;
    }
    att.remaining_seconds = att.duration_minutes*60;
    Exam._persistProgress(att.id);
    toast('Your examination has been restored. You may begin.','success');
  }
  const exam = DB.find('exams', att.exam_id);
  let questions = DB.findWhere('questions', q=> q.exam_id===att.exam_id).sort((a,b)=>a.order-b.order);
  if(questions.length===0){
    // Edge case: exam has no questions. Auto-submit with note and send to result page.
    toast('This examination has no questions. Contact your teacher.','warn');
    Exam._doSubmit(att, 'ADMIN_FORCED');
    location.hash = `#/result/${att.id}`;
    return;
  }
  if(exam.randomize_questions){ questions = questions.slice().sort(()=>Math.random()-0.5); }
  Exam._state = { attemptId, questions, currentIndex:0, flagged:new Set() };

  Views._examRender();
  // Start server-authoritative timer display
  Timer.start(att.id,
    (sec)=>{ const el=document.getElementById('timer-val'); if(el){ el.textContent=Timer.fmt(sec); el.className='timer '+(sec<60?'danger':sec<300?'warn':''); } },
    ()=>{ Exam.autoSubmit(att.id,'TIME_EXPIRED'); toast('Time expired. Submitted automatically.','warn'); location.hash=`#/result/${att.id}`; }
  );

  // Persist remaining time when the student leaves (browser close / tab hidden /
  // internet drop) so they can sign back in and resume exactly where they left.
  if(!window._examPauseWired){
    window._examPauseWired = true;
    const _persist = ()=>{ if(Exam._state && Exam._state.attemptId) Exam._persistProgress(Exam._state.attemptId); };
    window.addEventListener('beforeunload', _persist);
    window.addEventListener('pagehide', _persist);
    document.addEventListener('visibilitychange', ()=>{ if(document.hidden) _persist(); });
  }

  // Heartbeat: every 10s verify deadline (server-side equivalent)
  if(!window._examHeartbeat){
    window._examHeartbeat = setInterval(()=>{
      const cur = DB.find('attempts', Exam._state.attemptId);
      if(!cur || cur.status!=='IN_PROGRESS'){ window._examHeartbeat&&clearInterval(window._examHeartbeat); window._examHeartbeat=null; return; }
      if(Timer.remaining(cur.id)<=0){ clearInterval(window._examHeartbeat); window._examHeartbeat=null; Exam.autoSubmit(cur.id,'TIME_EXPIRED'); toast('Time expired. Submitted.','warn'); location.hash=`#/result/${cur.id}`; }
    }, 10000);
  }
};

Views._examRender = ()=>{
  const att = DB.find('attempts', Exam._state.attemptId);
  const exam = DB.find('exams', att.exam_id);
  const idx = Exam._state.currentIndex;
  const q = Exam._state.questions[idx];
  const saved = Exam.loadAnswer(q.id);
  const r = Q.render(q, att.id, saved);
  const total = Exam._state.questions.length;
  const answeredCount = Exam._state.questions.filter(qq=>{
    const a = Exam.loadAnswer(qq.id);
    return a!==null && a!=='' && !(typeof a==='object'&&Object.keys(a).length===0);
  }).length;
  const pct = total? Math.round((answeredCount/total)*100) : 0;
  const isLast = idx===total-1;

  document.getElementById('app').innerHTML = `
    <div class="exam-topbar no-print">
      <button class="btn btn-ghost btn-sm" onclick="Views._examMap()" title="See all questions">☰ Map</button>
      <div class="exam-title hide-sm">${escapeHtml(exam.title)}</div>
      <div class="exam-progress-wrap">
        <div class="exam-progress"><div class="fill" style="width:${pct}%"></div></div>
        <div class="exam-progress-text">${answeredCount}/${total}</div>
      </div>
      <div id="timer-val" class="timer">--:--</div>
      <button class="btn btn-danger btn-sm" onclick="Views._examSubmitConfirm()">Submit</button>
    </div>
    <div class="page">
      <div class="exam-qcard">
        <div class="q-header">
          <span class="q-counter">Question ${idx+1} of ${total}</span>
          <button class="q-flag-btn ${Exam._state.flagged.has(q.id)?'flagged':''}" onclick="Exam.flag('${q.id}'); Views._examRender()">
            ${Exam._state.flagged.has(q.id)?'★ Flagged':'☆ Flag this'}
          </button>
        </div>
        <div id="q-body" class="exam-qbody">${r.html}</div>
        <div class="exam-nav">
          <button class="btn btn-ghost" onclick="Views._examNav(${idx-1})" ${idx===0?'disabled':''}>← Previous</button>
          ${isLast
            ? `<button class="btn btn-mint" onclick="Views._examSubmitConfirm()">Finish &amp; Submit ✓</button>`
            : `<button class="btn btn-primary" onclick="Views._examNav(${idx+1})">Next →</button>`}
        </div>
      </div>
      <div class="t-center t-tiny t-muted" style="max-width:720px;margin:1rem auto 0">
        Answers save automatically. If your phone turns off, sign in again and continue — your work is safe.
      </div>
    </div>`;
  if(r.bind) setTimeout(r.bind, 0);
};

/* Question Map — on-demand full-screen navigator (replaces the always-on
   pill grid that crowded the screen for primary learners) */
Views._examMap = ()=>{
  if(document.getElementById('q-map-overlay')) return; // already open
  const total = Exam._state.questions.length;
  const idx = Exam._state.currentIndex;
  const answeredCount = Exam._state.questions.filter(qq=>{
    const a = Exam.loadAnswer(qq.id);
    return a!==null && a!=='' && !(typeof a==='object'&&Object.keys(a).length===0);
  }).length;
  const cells = Exam._state.questions.map((qq,i)=>{
    const a = Exam.loadAnswer(qq.id);
    const hasAns = a!==null && a!=='' && !(typeof a==='object'&&Object.keys(a).length===0);
    return `<div class="q-map-cell ${hasAns?'answered':''} ${Exam._state.flagged.has(qq.id)?'flagged':''} ${i===idx?'current':''}" onclick="Views._examNav(${i}); Views._examMapClose()">${i+1}</div>`;
  }).join('');
  const ov = document.createElement('div');
  ov.className = 'q-map-overlay';
  ov.id = 'q-map-overlay';
  ov.innerHTML = `
    <div class="q-map-panel">
      <div class="q-map-head">
        <h3>Question Map</h3>
        <button class="btn btn-ghost btn-sm" onclick="Views._examMapClose()">✕ Close</button>
      </div>
      <div class="t-small t-muted mb2">Tap any number to jump there. <b style="color:var(--mint-dark)">Green</b> = answered, <b style="color:var(--sun-dark)">Yellow</b> = flagged.</div>
      <div class="q-map-grid">${cells}</div>
      <div class="q-map-legend">
        <div class="lg"><div class="swatch" style="background:var(--mint)"></div>Answered</div>
        <div class="lg"><div class="swatch" style="background:var(--sun)"></div>Flagged</div>
        <div class="lg"><div class="swatch" style="background:var(--surface);outline:2px solid var(--coral)"></div>Current</div>
      </div>
      <div class="divider"></div>
      <div class="t-center t-small t-muted"><b>${answeredCount}</b> of ${total} answered</div>
    </div>`;
  ov.addEventListener('click', (e)=>{ if(e.target===ov) Views._examMapClose(); });
  document.body.appendChild(ov);
};
Views._examMapClose = ()=>{
  const el = document.getElementById('q-map-overlay');
  if(el) el.remove();
};

Views._examNav = (i)=>{
  if(i<0 || i>=Exam._state.questions.length) return;
  Exam._state.currentIndex = i;
  Views._examRender();
};

Views._examSubmitConfirm = ()=>{
  const att = DB.find('attempts', Exam._state.attemptId);
  const total = Exam._state.questions.length;
  const answered = Exam._state.questions.filter(qq=>{ const a=Exam.loadAnswer(qq.id); return a!==null && a!=='' && !(typeof a==='object'&&Object.keys(a).length===0); }).length;
  confirmDialog(
    `You have answered ${answered} of ${total} questions. Once submitted, you cannot change your answers. Submit now?`,
    ()=>{ if(Exam.manualSubmit(att.id)){ toast('Examination submitted.','success'); location.hash=`#/result/${att.id}`; } },
    { title:'Submit examination?', danger:false }
  );
};

/* ---------- STUDENT RESULT ---------- */
Views._flatAnswer = (q, val)=>{
  if(val===null||val===undefined||val==='') return '(no answer)';
  switch(q.type){
    case 'TRUE_FALSE': return String(val)==='true'?'True':(String(val)==='false'?'False':String(val));
    case 'FILL': return Array.isArray(val)? val.map(v=>(v===undefined||v==='')?'—':String(v)).join(' | ') : String(val);
    case 'MATCHING': return (typeof val==='object'&&!Array.isArray(val))? Object.entries(val).map(([k,v])=>k+' = '+v).join('; ') : String(val);
    default: return String(val);
  }
};
Views._flatCorrect = (q)=>{
  switch(q.type){
    case 'TRUE_FALSE': return (q.correct===true||q.correct==='true')?'True':((q.correct===false||q.correct==='false')?'False':'—');
    case 'FILL': return (q.accepted_answers||[]).map((arr,i)=>'Blank '+(i+1)+': '+((arr||[]).join(' / '))).join('; ');
    case 'MATCHING': return Object.entries(q.correct_pairs||{}).map(([k,v])=>k+' = '+v).join('; ');
    case 'PICTURE':
      if(q.options && q.correct!==undefined && q.correct!==null) return String(q.correct);
      return q.accepted_answers? (q.accepted_answers.flat()||[]).join(' / ') : (q.rubric?'Rubric-marked':'—');
    case 'SHORT': case 'READING': case 'DICTATION':
      if(q.options && q.correct!==undefined && q.correct!==null) return String(q.correct);
      return q.accepted_answers? (q.accepted_answers.flat()||[]).join(' / ') : (q.rubric?'Rubric-marked':'—');
    case 'WRITING': return q.rubric?('Rubric: '+q.rubric):'—';
    default: return (q.correct!==undefined&&q.correct!==null)?String(q.correct):'—';
  }
};
Views._qReviewState = (q, a)=>{
  const awarded = a?(Number(a.awarded)||0):0;
  const res = a?a.auto_result:null;
  const max = Number(q.marks)||0;
  if(max>0 && awarded>=max) return 'correct';
  if(awarded===0 || (res && res.correct===false)) return 'wrong';
  return 'partial';
};
Views.studentResult = (attemptId)=>{
  const att = DB.find('attempts', attemptId);
  if(!att){ toast('Result not found.','error'); return; }
  if(att.student_id !== Auth.current().id){ toast('This is not your result.','error'); return; }
  const exam = DB.find('exams', att.exam_id);
  // Students get the full question-by-question review once the teacher has MARKED the paper
  // (and through APPROVED / PUBLISHED / REJECTED). Before that, only a "received" summary is shown.
  const reviewed = ['MARKED','APPROVED','PUBLISHED','REJECTED'].includes(att.status);
  const awaiting = ['IN_PROGRESS','SUBMITTED','AWAITING_MARKING'].includes(att.status);
  if(!reviewed && !awaiting){ toast('This result is not yet available.','warn'); return; }

  const pct = att.max_marks? Math.round((att.total_marks/att.max_marks)*100) : 0;
  const pass = att.max_marks && exam.pass_mark? att.total_marks>=exam.pass_mark : null;

  // Build the per-question review (only when the teacher has marked)
  let reviewHtml = '';
  if(reviewed){
    const qs = DB.findWhere('questions',q=>q.exam_id===att.exam_id).sort((a,b)=>a.order-b.order);
    reviewHtml = qs.map((q,i)=>{
      const a = DB.firstWhere('answers', x=>x.attempt_id===att.id && x.question_id===q.id);
      const awarded = a?(Number(a.awarded)||0):0;
      const state = Views._qReviewState(q, a);
      const ST = { correct:{c:'#1a7d4b',t:'Correct'}, wrong:{c:'#b00020',t:'Incorrect'}, partial:{c:'#b8860b',t:'Partial'} }[state];
      const ansHtml = escapeHtml(Views._flatAnswer(q, a?a.value:null)).replace(/\n/g,'<br>');
      const corrHtml = escapeHtml(Views._flatCorrect(q)).replace(/\n/g,'<br>');
      // For MCQ-shaped questions, render every option: tick the correct one, cross a wrong pick.
      let optsHtml = '';
      if(q.options && (q.type==='MCQ'||q.type==='PICTURE'||(q.type==='READING'&&q.correct!==undefined&&q.correct!==null))){
        const picked = a? a.value : null;
        optsHtml = `<div style="margin:.4rem 0">${q.options.map(o=>{
          const isCorrect = o===q.correct, isPicked = o===picked;
          let col='#555', mark='';
          if(isCorrect){ col='#1a7d4b'; mark=' ✓'; if(isPicked) mark=' ✓ (your choice)'; }
          else if(isPicked){ col='#b00020'; mark=' ✗ (your choice)'; }
          return `<div style="color:${col};font-size:.9rem;padding:.1rem 0">${escapeHtml(o)}${mark}</div>`;
        }).join('')}</div>`;
      }
      return `<div class="card mb1" style="border-left:4px solid ${ST.c}">
        <div class="flex-between mb1" style="flex-wrap:wrap;gap:.4rem;align-items:center">
          <span class="badge badge-gray">Q${i+1}</span>
          <span class="badge badge-blue">${Q_TYPES[q.type]?.label||q.type}</span>
          <span style="margin-left:auto;font-weight:700">Mark: ${awarded}/${q.marks}</span>
          <span class="badge" style="background:${ST.c};color:#fff">${ST.t}</span>
        </div>
        ${q.passage_text?`<div class="passage"><h4>${escapeHtml(q.passage_title||'Passage')}</h4>${q.passage_text.split('\n').map(p=>`<p>${escapeHtml(p)}</p>`).join('')}</div>`:''}
        ${(q.media&&q.media.image)?`<div class="t-center mb1"><img src="${escapeHtml(q.media.image)}" style="max-width:100%;max-height:200px;border-radius:6px;border:1px solid var(--ink-200)"></div>`:(q.picture_emoji?`<div class="t-center mb1" style="font-size:2.5rem">${q.picture_emoji}</div>`:'')}
        ${(q.media&&q.media.audio)?`<div class="card mb1" style="background:var(--mint-soft)"><div class="t-tiny t-muted mb1">🎧 Listen</div><audio controls src="${escapeHtml(q.media.audio)}" style="width:100%"></audio></div>`:''}
        <div class="t-bold mb1">${escapeHtml(q.prompt)}</div>
        ${optsHtml}
        <div style="display:grid;gap:.3rem;margin-top:.4rem">
          <div style="background:#fff5f5;border:1px solid #f0d0d0;border-radius:6px;padding:.4rem .5rem">
            <div class="t-tiny t-muted" style="margin-bottom:.15rem">YOUR ANSWER</div>
            <div style="color:${state==='wrong'?'#b00020':(state==='correct'?'#1a7d4b':'#333')};font-weight:${state==='wrong'||state==='correct'?'700':'400'}">${ansHtml}</div>
          </div>
          <div style="background:#f0faf3;border:1px solid #c0e8d0;border-radius:6px;padding:.4rem .5rem">
            <div class="t-tiny t-muted" style="margin-bottom:.15rem">CORRECT ANSWER</div>
            <div style="color:#1a7d4b;font-weight:700">${corrHtml}</div>
          </div>
          ${a&&a.teacher_feedback?`<div style="background:#f3f1ee;border:1px solid #e0dccf;border-radius:6px;padding:.4rem .5rem"><div class="t-tiny t-muted" style="margin-bottom:.15rem">TEACHER FEEDBACK</div><div>${escapeHtml(a.teacher_feedback)}</div></div>`:''}
        </div>
      </div>`;
    }).join('');
  }

  Views.shell(`
    <div class="page-narrow">
      <div class="card">
        <div class="flex-between mb1" style="flex-wrap:wrap;gap:.5rem">
          <h2 style="margin:0">${escapeHtml(exam.title)}</h2>
          ${reviewed?`<div class="row" style="gap:.4rem">
            <button class="btn btn-ghost btn-sm" onclick="Views._downloadResultCSV('${att.id}')">Download CSV</button>
            <button class="btn btn-ghost btn-sm" onclick="Views._printResult('${att.id}')">Print / PDF</button>
          </div>`:''}
        </div>
        <div class="sub mb2">${escapeHtml(exam.subject)} · ${escapeHtml(clsName(exam.class_id))}</div>

        ${att.status==='REJECTED'?`<div class="alert" style="background:#fdecea;color:#b00020;border:1px solid #f5c6cb"><b>Result not approved.</b> ${att.teacher_feedback?escapeHtml(att.teacher_feedback):'Your teacher has returned this result. Please contact them for details.'}</div>`:''}

        ${reviewed?`
          <div class="card mb2" style="background:var(--mint-soft); border-color:var(--mint)">
            <div class="flex-between">
              <div>
                <div class="t-tiny t-muted">Your score</div>
                <div class="t-bold" style="font-size:2.2rem;color:var(--mint-dark)">${att.total_marks} / ${att.max_marks}</div>
                <div class="badge ${pass?'badge-green':'badge-red'}">${pass===null?'—':(pass?'PASSED':'Below pass mark')}</div>
              </div>
              <div style="text-align:center">
                <div style="font-size:1.6rem;font-weight:800;color:var(--mint-dark)">${pct}%</div>
                <div class="t-tiny t-muted">overall</div>
              </div>
            </div>
          </div>
          <div class="t-small t-muted mb2">Submitted ${fmtDate(att.submitted_at)} · Status: ${ATTEMPT_STATUS[att.status]}${att.published_at?' · Published '+fmtDate(att.published_at):(att.approved_at?' · Approved '+fmtDate(att.approved_at):'')}</div>
          ${att.teacher_feedback && att.status!=='REJECTED'?`<div class="alert alert-info"><b>Teacher feedback:</b><br>${escapeHtml(att.teacher_feedback)}</div>`:''}

          <h3 class="mb1">Question-by-question review</h3>
          <div class="t-small t-muted mb2">Questions you got <b style="color:#b00020">wrong</b> are shown in red; <b style="color:#1a7d4b">correct</b> in green.</div>
          ${reviewHtml}
        `:`
          <div class="alert alert-info">
            <b>Status:</b> ${ATTEMPT_STATUS[att.status]}<br>
            Your examination has been received. Once your teacher has marked it, you will see your answers, the correct answers, and the questions you got wrong — right here.
          </div>
          <div class="t-small t-muted">Submitted at ${fmtDate(att.submitted_at)} · ${att.submission_reason==='TIME_EXPIRED'?'Auto-submitted (time expired)':'You submitted manually'}</div>
        `}

        <div class="row mt2">
          <a href="#/dashboard" class="btn btn-ghost">Back to dashboard</a>
          <a href="#/history" class="btn btn-ghost">View history</a>
        </div>
      </div>
    </div>`);
};

/* ---------- TEACHER DASHBOARD ---------- */
Views.teacherDashboard = ()=>{
  const sess = Auth.current();
  const assigns = DB.findWhere('teacher_assignments', t=> t.teacher_id===sess.id);
  const exams = DB.findWhere('exams', e=> e.teacher_id===sess.id).sort((a,b)=> new Date(b.created_at)-new Date(a.created_at));
  const markingQueue = DB.findWhere('attempts', a=>{
    const e = DB.find('exams', a.exam_id);
    return e && e.teacher_id===sess.id && a.status==='AWAITING_MARKING';
  });
  const approvalQueue = DB.findWhere('attempts', a=>{
    const e = DB.find('exams', a.exam_id);
    return e && e.teacher_id===sess.id && a.status==='MARKED' && !a.approved;
  });

  Views.shell(`
    <div class="page">
      <div class="flex-between mb2">
        <h2 style="margin:0">Teacher dashboard</h2>
        <a href="#/exams/new" class="btn btn-primary">+ New examination</a>
      </div>

      <div class="grid grid-4 mb2">
        <div class="card"><div class="stat"><div class="v">${assigns.length}</div><div class="l">Class/subject assignments</div></div></div>
        <div class="card"><div class="stat"><div class="v">${exams.length}</div><div class="l">Examinations created</div></div></div>
        <div class="card"><div class="stat"><div class="v">${markingQueue.length}</div><div class="l">Awaiting marking</div></div></div>
        <div class="card"><div class="stat"><div class="v">${approvalQueue.length}</div><div class="l">Awaiting approval</div></div></div>

      <h3 class="mb1">My class / subject assignments</h3>

        <table class="table">
          <thead><tr><th>Class</th><th>Subject</th><th>Students</th><th>Examinations</th></tr></thead>
          <tbody>
            ${assigns.map(a=>{
              const stuCount = DB.findWhere('students', s=> s.class_id===a.class_id).length;
              const exCount = DB.findWhere('exams', e=> e.teacher_id===sess.id && e.class_id===a.class_id && e.subject===a.subject).length;
              return `<tr><td>${escapeHtml(clsName(a.class_id))}</td><td>${escapeHtml(a.subject)}</td><td>${stuCount}</td><td>${exCount}</td></tr>`;

        </table>
      </div>

      <h3 class="mb1">Marking queue</h3>
      ${markingQueue.length===0?`<div class="empty mb3"><div class="ico">✓</div><h3>Nothing to mark</h3><p>Submitted examinations awaiting manual marking will appear here.</p></div>`:`
        <div class="table-wrap mb3">
          <table class="table">
            <thead><tr><th>Student</th><th>Examination</th><th>Submitted</th><th></th></tr></thead>
            <tbody>
              ${markingQueue.map(a=>{
                const s = DB.find('students', a.student_id); const e = DB.find('exams', a.exam_id);
                return `<tr><td>${escapeHtml(s.name)}</td><td>${escapeHtml(e.title)}</td><td class="t-small">${fmtDateShort(a.submitted_at)}</td><td><a href="#/marking/${a.id}" class="btn btn-primary btn-sm">Mark now</a></td></tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>`}

      <h3 class="mb1">My examinations</h3>
      ${exams.length===0?`<div class="empty"><div class="ico">📝</div><h3>No examinations yet</h3><p>Create your first examination.</p><a href="#/exams/new" class="btn btn-primary">+ New examination</a></div>`:`
        <div class="table-wrap">
          <table class="table">
            <thead><tr><th>Title</th><th>Class</th><th>Subject</th><th>Status</th><th>Attempts</th><th></th></tr></thead>
            <tbody>
              ${exams.map(e=>{
                const atts = DB.findWhere('attempts', a=> a.exam_id===e.id);
                const canEdit = Exam.canEditExam(e.id);
                return `<tr>
                  <td>${escapeHtml(e.title)}</td>
                  <td>${escapeHtml(clsName(e.class_id))}</td>
                  <td>${escapeHtml(e.subject)}</td>
                  <td><span class="badge ${e.status==='PUBLISHED'?'badge-green':e.status==='DRAFT'?'badge-gray':'badge-blue'}">${EXAM_STATUS[e.status]}</span></td>
                  <td>${atts.length}</td>
                  <td>
                    <a href="#/exams/edit/${e.id}" class="btn btn-ghost btn-sm">${canEdit?'Edit':'View'}</a>
                    <a href="#/exams/preview/${e.id}" class="btn btn-ghost btn-sm">Preview</a>
                    <button class="btn btn-ghost btn-sm" onclick="Views._printExam('${e.id}')">Download</button>
                    ${atts.length?`<a href="#/marking" class="btn btn-ghost btn-sm">Marking</a>`:''}
                  </td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>`}
    </div>`);

/* ---------- EXAM EDITOR ---------- */
Views.examEditor = (examId)=>{
  const sess = Auth.current();
  const assigns = DB.findWhere('teacher_assignments', t=> t.teacher_id===sess.id);
  if(assigns.length===0){ toast('You have no class assignments.','warn'); return; }
  const editing = examId? DB.find('exams', examId) : null;
  if(editing && editing.teacher_id!==sess.id){ toast('You can only edit your own examinations.','error'); return; }
  if(editing && !Exam.canEditExam(examId)){
    toast('This examination has student attempts and can no longer be edited.','warn');
    location.hash = '#/exams/preview/'+examId; return;
  }
  const e = editing || { title:'', class_id:assigns[0].class_id, subject:assigns[0].subject, category:APP.categories[0], academic_year:DB.raw().settings.academic_year, term:APP.terms[0], duration_minutes:30, total_marks:10, pass_mark:5, attempts_allowed:1, instructions:'', timing_policy:'ELAPSED', randomize_questions:false, randomize_options:false, require_approval:true, publish_results:false, status:'DRAFT', navigation_rule:'FREE', opens_at:nowISO(), closes_at:new Date(Date.now()+86400000).toISOString() };

  Views.shell(`
    <div class="page">
      <h2 class="mb2">${editing?'Edit examination':'Create new examination'}</h2>
      <div class="card mb2">
        <div class="grid grid-2">
          <div class="field">
            <label>Examination title *</label>
            <input id="e_title" class="input" value="${escapeHtml(e.title)}" placeholder="e.g. STD 5 Maths — Fractions Test">
          </div>
          <div class="field">
            <label>Category</label>
            <select id="e_cat" class="input">${APP.categories.map(c=>`<option ${e.category===c?'selected':''}>${c}</option>`).join('')}</select>
          </div>
          <div class="field">
            <label>Class *</label>
            <select id="e_class" class="input" onchange="Views._examEditorSubjects()">
              ${[...new Set(assigns.map(a=>a.class_id))].map(cid=>`<option value="${cid}" ${e.class_id===cid?'selected':''}>${escapeHtml(clsName(cid))}</option>`).join('')}
            </select>
          </div>
          <div class="field">
            <label>Subject *</label>
            <select id="e_subj" class="input" id="e_subj"></select>
          </div>
          <div class="field"><label>Term</label><select id="e_term" class="input">${APP.terms.map(t=>`<option ${e.term===t?'selected':''}>${t}</option>`).join('')}</select></div>
          <div class="field"><label>Academic year</label><input id="e_year" class="input" value="${escapeHtml(e.academic_year)}"></div>
          <div class="field"><label>Opens at *</label><input id="e_opens" type="datetime-local" class="input" value="${(e.opens_at||'').slice(0,16)}"></div>
          <div class="field"><label>Closes at *</label><input id="e_closes" type="datetime-local" class="input" value="${(e.closes_at||'').slice(0,16)}"></div>
          <div class="field"><label>Duration (minutes) *</label><input id="e_dur" type="number" min="1" class="input" value="${e.duration_minutes}"></div>
          <div class="field"><label>Total marks *</label><input id="e_marks" type="number" min="1" class="input" value="${e.total_marks}"></div>
          <div class="field"><label>Pass mark</label><input id="e_pass" type="number" min="0" class="input" value="${e.pass_mark||0}"></div>
          <div class="field"><label>Allowed attempts</label><input id="e_att" type="number" min="1" class="input" value="${e.attempts_allowed||1}"></div>
        </div>
        <div class="field">
          <label>Instructions to students</label>
          <textarea id="e_instr" class="input">${escapeHtml(e.instructions)}</textarea>
        </div>
        <div class="grid grid-2">
          <div class="field">
            <label>Timing policy</label>
            <select id="e_pol" class="input">${APP.timingPolicies.map(p=>`<option value="${p.id}" ${e.timing_policy===p.id?'selected':''}>${escapeHtml(p.label)}</option>`).join('')}</select>
          </div>
          <div class="field">
            <label>Question navigation</label>
            <select id="e_nav" class="input"><option value="FREE" ${e.navigation_rule==='FREE'?'selected':''}>Free (any order)</option><option value="LINEAR" ${e.navigation_rule==='LINEAR'?'selected':''}>Linear (one at a time)</option></select>
          </div>
        </div>
        <div class="row">
          <label class="check"><input type="checkbox" id="e_rq" ${e.randomize_questions?'checked':''}> Randomize question order</label>
          <label class="check"><input type="checkbox" id="e_ro" ${e.randomize_options?'checked':''}> Randomize option order</label>
          <label class="check"><input type="checkbox" id="e_ap" ${e.require_approval?'checked':''}> Require teacher approval before results</label>
        </div>
      </div>

      <div class="flex-between mb2">
        <h3 style="margin:0">Questions</h3>
        <div>
          <button class="btn btn-ghost btn-sm" onclick="Views._examEditorAddQuestion()">+ Add question</button>
        </div>
      </div>
      <div id="q-list" class="mb2"></div>

      <div class="row">
        <a href="#/teacher" class="btn btn-ghost">Cancel</a>
        <button id="exam-save-draft" class="btn btn-blue" onclick="Views._examEditorSave('DRAFT')">Save as draft</button>
        <button id="exam-publish" class="btn btn-primary" onclick="Views._examEditorSave('PUBLISHED')">Publish</button>
      </div>
    </div>`);
  Views._examEditorSubjects();
  Views._examEditorRenderQuestions();
};
Views._examEditorSubjects = ()=>{
  const sess = Auth.current();
  const cid = document.getElementById('e_class').value;
  const assigns = DB.findWhere('teacher_assignments', t=> t.teacher_id===sess.id && t.class_id===cid);
  const sel = document.getElementById('e_subj');
  const cur = sel.value;
  sel.innerHTML = assigns.map(a=>`<option value="${escapeHtml(a.subject)}">${escapeHtml(a.subject)}</option>`).join('');
  if(cur && assigns.some(a=>a.subject===cur)) sel.value = cur;
};

Views._examEditorRenderQuestions = ()=>{
  // We store a transient list in window._editorQuestions
  const examId = location.hash.split('/').pop();
  if(examId && examId!=='new' && DB.find('exams', examId) && !window._editorQuestions){
    window._editorQuestions = DB.findWhere('questions', q=> q.exam_id===examId).sort((a,b)=>a.order-b.order);
  }
  if(!window._editorQuestions) window._editorQuestions = [];
  const list = window._editorQuestions;
  const wrap = document.getElementById('q-list');
  if(list.length===0){
    wrap.innerHTML = `<div class="empty"><div class="ico">❓</div><h3>No questions yet</h3><p>Add your first question.</p><button class="btn btn-primary" onclick="Views._examEditorAddQuestion()">+ Add question</button></div>`;
    return;
  }
  wrap.innerHTML = list.map((q,i)=>`
    <div class="card mb1">
      <div class="flex-between">
        <div><span class="badge badge-gray">Q${i+1}</span> <span class="badge badge-blue">${Q_TYPES[q.type]?.label||q.type}</span> <span class="badge badge-green">${q.marks} marks</span></div>
        <div>
          <button class="btn btn-ghost btn-sm" onclick="Views._examEditorEditQuestion(${i})">Edit</button>
          <button class="btn btn-ghost btn-sm" onclick="Views._examEditorDelQuestion(${i})">Delete</button>
        </div>
      </div>
      <div class="mt1 t-small">${escapeHtml(q.prompt.slice(0,140))}${q.prompt.length>140?'…':''}</div>
    </div>`).join('');
};

Views._examEditorAddQuestion = ()=>{ Views._examEditorEditQuestion(-1); };
Views._examEditorEditQuestion = (idx)=>{
  const types = Object.keys(Q_TYPES);
  const q = idx>=0? window._editorQuestions[idx] : { type:'MCQ', marks:2, prompt:'', options:['','','',''], correct:'', auto_markable:true };
  const body = `
    <div class="field"><label>Question type</label>
      <select id="q_type" class="input" onchange="Views._qEditorTypeChange()">
        ${types.map(t=>`<option value="${t}" ${q.type===t?'selected':''}>${Q_TYPES[t].label}</option>`).join('')}
      </select>
    </div>
    <div class="field"><label>Marks</label><input id="q_marks" type="number" min="1" class="input" value="${q.marks}"></div>
    <div class="field"><label>Question prompt *</label><textarea id="q_prompt" class="input">${escapeHtml(q.prompt)}</textarea></div>
    <div id="q_type_fields"></div>
    <div class="field"><label>Curriculum level / topic</label>
      <input id="q_topic" class="input" value="${escapeHtml(q.topic||'')}" placeholder="e.g. Fractions — addition">
    </div>
    <button class="btn btn-primary btn-block" onclick="Views._qEditorSave(${idx})">Save question</button>
  `;
  openModal(idx>=0?'Edit question':'Add question', body, {size:'lg'});
  Views._qEditorTypeChange(q);
};
Views._qEditorTypeChange = (existing)=>{
  const t = document.getElementById('q_type').value;
  const wrap = document.getElementById('q_type_fields');
  const q = existing || window._editorQuestions[parseInt((location.hash.match(/edit\-(\d+)/)||[])[1]||'-1')] || { options:['','','',''], correct:'', accepted_answers:[['']], left_items:['',''], right_items:['',''], correct_pairs:{}, blanks:1, picture_emoji:'', picture_caption:'', passage_title:'', passage_text:'' };
  // Per-session media buffer (image / audio / left-images) — loaded from the
  // question's existing media so re-saving without re-picking keeps attachments.
  window._qMediaPick = {
    image: (q.media && q.media.image) || null,
    audio: (q.media && q.media.audio) || null,
    left_images: ((q.media && q.media.left_images) || []).slice(),
    _q: q
  };
  let html='';
  switch(t){
    case 'MCQ':
      html += `<div class="field"><label>Options (one per line, at least 2)</label>
        <textarea id="q_options" class="input" style="min-height:120px">${(q.options||[]).join('\n')}</textarea></div>
        <div class="field"><label>Correct answer</label><input id="q_correct" class="input" value="${escapeHtml(q.correct||'')}"></div>`;
      break;
    case 'PICTURE':
      html += `<div class="field"><label>Picture image — attach from your device</label>
        <div id="q_pic_preview">${window._qMediaPick.image?`<img src="${escapeHtml(window._qMediaPick.image)}" style="max-width:100%;max-height:160px;border-radius:6px;border:1px solid var(--ink-200)">`:''}</div>
        <div class="row mt1" style="gap:.4rem">
          <button type="button" class="btn btn-ghost btn-sm" onclick="Views._pickImage(function(d){ window._qMediaPick.image=d; Views._renderPicPreview(); })">${window._qMediaPick.image?'Replace image':'Attach image'}</button>
          ${window._qMediaPick.image?`<button type="button" class="btn btn-ghost btn-sm" onclick="window._qMediaPick.image=null; Views._renderPicPreview();">Remove image</button>`:''}
        </div></div>
        <div class="field"><label>…or use an emoji / short text instead of an image</label><input id="q_pic" class="input" value="${escapeHtml(q.picture_emoji||'')}" placeholder="e.g. 🐘"></div>
        <div class="field"><label>Picture caption (optional)</label><input id="q_piccap" class="input" value="${escapeHtml(q.picture_caption||'')}"></div>
        <div class="field"><label>Answer mode</label>
          <select id="q_picmode" class="input" onchange="Views._qPicModeChange()">
            <option value="MCQ" ${(q.options&&q.options.length)?'selected':''}>Multiple choice (pick the correct option)</option>
            <option value="ANSWER" ${(!q.options||!q.options.length)?'selected':''}>Write the answer (e.g. count &amp; write)</option>
          </select></div>
        <div id="q_pic_sub"></div>`;
      break;
    case 'TRUE_FALSE':
      html += `<div class="field"><label>Correct answer</label>
        <select id="q_tf" class="input"><option value="true" ${q.correct===true||q.correct==='true'?'selected':''}>True</option><option value="false" ${q.correct===false||q.correct==='false'?'selected':''}>False</option></select></div>`;
      break;
    case 'FILL':
      html += `<div class="field"><label>Number of blanks</label><input id="q_blanks" type="number" min="1" max="10" class="input" value="${q.blanks||1}"></div>
        <div class="field"><label>Accepted answers — one set per line, alternatives separated by | (e.g. <code>8 | eight</code>)</label>
        <textarea id="q_accepted" class="input" style="min-height:100px">${(q.accepted_answers||[['']]).map(a=>a.join(' | ')).join('\n')}</textarea></div>
        <div class="row">
          <label class="check"><input type="checkbox" id="q_case" ${q.case_sensitive?'checked':''}> Case sensitive</label>
          <label class="check"><input type="checkbox" id="q_trim" ${q.trim_whitespace!==false?'checked':''}> Trim whitespace</label>
          <label class="check"><input type="checkbox" id="q_partial" ${q.partial_marking?'checked':''}> Partial marking</label>
        </div>`;
      break;
    case 'SHORT':
      html += `<div class="field"><label>Accepted answers (optional — pipe-separated for alternatives). Leave empty for manual marking.</label>
        <input id="q_short_acc" class="input" value="${escapeHtml((q.accepted_answers||[]).flat().join(' | '))}" placeholder="e.g. 8 | eight"></div>
        <div class="row">
          <label class="check"><input type="checkbox" id="q_auto" ${q.auto_markable?'checked':''}> Auto-mark if exact match</label>
          <label class="check"><input type="checkbox" id="q_case" ${q.case_sensitive?'checked':''}> Case sensitive</label>
        </div>
        <div class="field"><label>Numeric tolerance (for maths; 0 = exact)</label><input id="q_tol" type="number" step="any" class="input" value="${q.numeric_tolerance||0}"></div>
        <div class="field"><label>Marking rubric / guide (teacher only)</label><textarea id="q_rubric" class="input">${escapeHtml(q.rubric||'')}</textarea></div>`;
      break;
    case 'MATCHING':
      html += `<div class="field"><label>Left items (one per line)</label><textarea id="q_left" class="input" style="min-height:100px">${(q.left_items||[]).join('\n')}</textarea></div>
        <div class="field"><label>Right items (one per line — will be shuffled for students)</label><textarea id="q_right" class="input" style="min-height:100px">${(q.right_items||[]).join('\n')}</textarea></div>
        <div class="field"><label>Correct pairs — format: left = right (one per line)</label>
          <textarea id="q_pairs" class="input" style="min-height:120px">${Object.entries(q.correct_pairs||{}).map(([l,r])=>`${l} = ${r}`).join('\n')}</textarea></div>
        <label class="check"><input type="checkbox" id="q_partial" ${q.partial_marking?'checked':''}> Partial marking</label>
        <div class="field mt1"><label>Left-item images (optional — match a picture to a word, like the worksheet)</label>
          <button type="button" class="btn btn-ghost btn-sm" onclick="Views._qMatchImages()">${(window._qMediaPick.left_images||[]).filter(Boolean).length?'Manage left-item images ('+(window._qMediaPick.left_images||[]).filter(Boolean).length+' set)':'Attach images for left items'}</button></div>`;
      break;
    case 'READING':
      html += `<div class="field"><label>Passage title</label><input id="q_ptitle" class="input" value="${escapeHtml(q.passage_title||'')}"></div>
        <div class="field"><label>Passage text (use blank lines between paragraphs)</label><textarea id="q_ptext" class="input" style="min-height:160px">${escapeHtml(q.passage_text||'')}</textarea></div>
        <div class="field"><label>Question type under this passage</label>
          <select id="q_subt" class="input" onchange="Views._qReadingSubChange()">

Views._pickImage = (cb)=>{
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*';
  inp.onchange = ()=>{
    const f = inp.files && inp.files[0]; if(!f) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      const dataUrl = reader.result;
      const img = new Image();
      img.onload = ()=>{
        const maxDim = 1000; let width = img.width, height = img.height;
        if(width > maxDim || height > maxDim){ const s = maxDim/Math.max(width,height); width = Math.round(width*s); height = Math.round(height*s); }
        const c = document.createElement('canvas'); c.width = width; c.height = height;
        c.getContext('2d').drawImage(img, 0, 0, width, height);
        cb(c.toDataURL('image/jpeg', 0.85));
      };
      img.onerror = ()=> cb(dataUrl);  // fallback: use original if resize fails
      img.src = dataUrl;
    };
    reader.readAsDataURL(f);
  };
  inp.click();
};
Views._pickAudio = (cb)=>{
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'audio/*';
  inp.onchange = ()=>{
    const f = inp.files && inp.files[0]; if(!f) return;
    if(f.size > 8*1024*1024) toast('Audio is '+Math.round(f.size/1024/1024)+'MB — it will work but may be slow to save.','warn');
    const reader = new FileReader();
    reader.onload = ()=> cb(reader.result);
    reader.readAsDataURL(f);
  };
  inp.click();
};

Views._qEditorSave = (idx)=>{
  const t = document.getElementById('q_type').value;
  const marks = parseInt(document.getElementById('q_marks').value)||1;
  const prompt = document.getElementById('q_prompt').value.trim();
  const topic = document.getElementById('q_topic').value.trim();
  if(!prompt){ toast('Prompt is required.','warn'); return; }
  const q = { type:t, marks, prompt, topic, auto_markable: Q_TYPES[t].autoMarkable===true };
  switch(t){
    case 'MCQ':
      q.options = document.getElementById('q_options').value.split('\n').map(s=>s.trim()).filter(Boolean);
      q.correct = document.getElementById('q_correct').value.trim();
      q.auto_markable = true;   // MCQ has a single correct option → always auto-markable
      if(q.options.length<2){ toast('Add at least 2 options.','warn'); return; }
      if(!q.options.includes(q.correct)){ toast('Correct answer must match one option.','warn'); return; }
      break;
    case 'PICTURE': {
      const picMode = document.getElementById('q_picmode').value;
      q.picture_emoji = document.getElementById('q_pic').value;
      q.picture_caption = document.getElementById('q_piccap').value;
      if(window._qMediaPick && window._qMediaPick.image){
        q.media = Object.assign({}, q.media, { image: window._qMediaPick.image });
      }
      if(picMode==='MCQ'){
        q.options = document.getElementById('q_options').value.split('\n').map(s=>s.trim()).filter(Boolean);
        q.correct = document.getElementById('q_correct').value.trim();
        q.auto_markable = true;
        if(q.options.length<2){ toast('Add at least 2 options.','warn'); return; }
        if(!q.options.includes(q.correct)){ toast('Correct answer must match one option.','warn'); return; }
      } else {
        const acc = document.getElementById('q_short_acc').value.trim();
        if(acc){ q.accepted_answers = [acc.split('|').map(s=>s.trim()).filter(Boolean)]; q.auto_markable = document.getElementById('q_auto').checked; }
        else { q.auto_markable = false; }
        q.case_sensitive = document.getElementById('q_case').checked;
        q.rubric = document.getElementById('q_rubric').value;
        q.manual_marking = !q.auto_markable;
      }
      if(!q.media && !q.picture_emoji && !q.picture_caption){ toast('Attach an image or enter an emoji for the picture.','warn'); return; }
      break;
    }
    case 'TRUE_FALSE':
      q.correct = document.getElementById('q_tf').value==='true';
      break;
    case 'FILL':
      q.blanks = parseInt(document.getElementById('q_blanks').value)||1;
      q.accepted_answers = document.getElementById('q_accepted').value.split('\n').map(l=>l.split('|').map(s=>s.trim()).filter(Boolean));
      q.case_sensitive = document.getElementById('q_case').checked;
      q.trim_whitespace = document.getElementById('q_trim').checked;
      q.partial_marking = document.getElementById('q_partial').checked;
      if(q.accepted_answers.length < q.blanks){ toast('Provide accepted answers for each blank.','warn'); return; }
      break;
    case 'SHORT':
      const acc = document.getElementById('q_short_acc').value.trim();
      if(acc){ q.accepted_answers = [acc.split('|').map(s=>s.trim()).filter(Boolean)]; q.auto_markable = document.getElementById('q_auto').checked; }
      else { q.auto_markable = false; }
      q.case_sensitive = document.getElementById('q_case').checked;
      q.numeric_tolerance = parseFloat(document.getElementById('q_tol').value)||0;
      q.rubric = document.getElementById('q_rubric').value;
      q.manual_marking = !q.auto_markable;
      break;
    case 'MATCHING':
      q.left_items = document.getElementById('q_left').value.split('\n').map(s=>s.trim()).filter(Boolean);
      q.right_items = document.getElementById('q_right').value.split('\n').map(s=>s.trim()).filter(Boolean);
      q.correct_pairs = {};
      document.getElementById('q_pairs').value.split('\n').forEach(l=>{ const m=l.split('='); if(m.length===2) q.correct_pairs[m[0].trim()]=m[1].trim(); });
      q.partial_marking = document.getElementById('q_partial').checked;
      if(q.left_items.length<2 || q.right_items.length<2){ toast('Add at least 2 items in each column.','warn'); return; }
      if(Object.keys(q.correct_pairs).length!==q.left_items.length){ toast('Provide a correct pair for each left item.','warn'); return; }
      if(window._qMediaPick && window._qMediaPick.left_images && window._qMediaPick.left_images.some(Boolean)){
        q.media = Object.assign({}, q.media, { left_images: window._qMediaPick.left_images });
      }
      break;
    case 'DICTATION':
      if(window._qMediaPick && window._qMediaPick.audio){
        q.media = Object.assign({}, q.media, { audio: window._qMediaPick.audio });
      } else if(!(q.media && q.media.audio)){
        toast('Attach an audio clip for the dictation.','warn'); return;
      }
      { const acc = document.getElementById('q_short_acc').value.trim();
        if(acc){ q.accepted_answers = [acc.split('|').map(s=>s.trim()).filter(Boolean)]; q.auto_markable = document.getElementById('q_auto').checked; }
        else { q.auto_markable = false; }
        q.case_sensitive = document.getElementById('q_case').checked;
        q.rubric = document.getElementById('q_rubric').value;
        q.manual_marking = !q.auto_markable; }
      break;
    case 'READING':
      q.passage_title = document.getElementById('q_ptitle').value.trim();
      q.passage_text = document.getElementById('q_ptext').value;
      const subt = document.getElementById('q_subt').value;
      if(subt==='MCQ'){
        q.options = document.getElementById('q_options').value.split('\n').map(s=>s.trim()).filter(Boolean);
        q.correct = document.getElementById('q_correct').value.trim();
        q.auto_markable = true;
      } else {
        const acc = document.getElementById('q_short_acc').value.trim();
        if(acc){ q.accepted_answers = [acc.split('|').map(s=>s.trim()).filter(Boolean)]; q.auto_markable = document.getElementById('q_auto').checked; }
        else { q.auto_markable = false; }
        q.rubric = document.getElementById('q_rubric').value;
        q.manual_marking = !q.auto_markable;
      }
      break;
    case 'WRITING':
      q.min_words = parseInt(document.getElementById('q_minw').value)||0;
      q.suggested_words = parseInt(document.getElementById('q_sugw').value)||0;
      q.max_words = parseInt(document.getElementById('q_maxw').value)||0;
      q.rubric = document.getElementById('q_rubric').value;
      q.auto_markable = false; q.manual_marking = true;
      break;
  }
  if(idx>=0){ window._editorQuestions[idx] = Object.assign(window._editorQuestions[idx], q); }
  else { window._editorQuestions.push(q); }
  closeModal();
  Views._examEditorRenderQuestions();
  toast('Question saved.','success');
};

Views._examEditorSave = async (status)=>{
  const sess = Auth.current();
  const title = document.getElementById('e_title').value.trim();
  if(!title){ toast('Title is required.','warn'); return; }
  const opens = document.getElementById('e_opens').value;
  const closes = document.getElementById('e_closes').value;
  if(!opens||!closes){ toast('Opening and closing times are required.','warn'); return; }
  if(new Date(opens) >= new Date(closes)){ toast('Closing time must be after opening time.','warn'); return; }
  if(window._editorQuestions.length===0){ toast('Add at least one question.','warn'); return; }
  const totalMarks = window._editorQuestions.reduce((s,q)=>s+(q.marks||0),0);
  const examId = (location.hash.match(/edit\/([^/]+)/)||[])[1];
  const payload = {
    title, class_id:document.getElementById('e_class').value, subject:document.getElementById('e_subj').value,
    category:document.getElementById('e_cat').value, term:document.getElementById('e_term').value,
    academic_year:document.getElementById('e_year').value.trim(),
    exam_date:opens, opens_at:new Date(opens).toISOString(), closes_at:new Date(closes).toISOString(),
    duration_minutes:parseInt(document.getElementById('e_dur').value)||30,
    total_marks:totalMarks,
    pass_mark:parseInt(document.getElementById('e_pass').value)||0,
    attempts_allowed:parseInt(document.getElementById('e_att').value)||1,
    instructions:document.getElementById('e_instr').value,
    timing_policy:document.getElementById('e_pol').value,
    navigation_rule:document.getElementById('e_nav').value,
    randomize_questions:document.getElementById('e_rq').checked,
    randomize_options:document.getElementById('e_ro').checked,
    require_approval:document.getElementById('e_ap').checked,
    status, teacher_id:sess.id
  };
  if(totalMarks !== parseInt(document.getElementById('e_marks').value)){
    // sync total marks to sum of question marks
    payload.total_marks = totalMarks;
  }

  const btnDraft = document.getElementById('exam-save-draft');
  const btnPub   = document.getElementById('exam-publish');
  const setBtns  = (disabled, draftText, pubText) => {
    if(btnDraft){ btnDraft.disabled = disabled; btnDraft.textContent = draftText; }
    if(btnPub){   btnPub.disabled   = disabled; btnPub.textContent   = pubText; }
  };
  setBtns(true, 'Saving…', status==='PUBLISHED'?'Publishing…':'Saving…');

  try {
    let exam;
    if(examId && DB.find('exams', examId)){
      // Editing an existing exam — the row is already committed in Supabase,
      // so child question inserts will satisfy the FK immediately.
      exam = DB.update('exams', examId, payload);
      DB.findWhere('questions', q=>q.exam_id===examId).forEach(q=> DB.remove('questions', q.id));
    } else {
      // New exam — MUST await the insert so the row is committed in Postgres
      // before we insert questions that reference it (otherwise the FK check
      // on exam_questions.exam_id races the parent insert and fails).
      exam = await DB.insertAsync('exams', payload);
    }
    window._editorQuestions.forEach((q,i)=> DB.insert('questions', Object.assign({}, q, { exam_id:exam.id, order:i+1 })) );
    window._editorQuestions = null;
    DB.audit(status==='PUBLISHED'?'EXAM_PUBLISH':'EXAM_SAVE', sess.id, sess.role, { exam_id:exam.id });
    toast(status==='PUBLISHED'?'Examination published. Students can now start it during the open window.':'Saved as draft.','success');
    location.hash = '#/teacher';
  } catch(e){
    toast('Error: '+(e.message||''),'error');
  } finally {
    setBtns(false, 'Save as draft', 'Publish');
  }
};

Views.marking = (attemptId)=>{
  const sess = Auth.current();
  const att = DB.find('attempts', attemptId);
  if(!att){ toast('Attempt not found.','error'); return; }
  const exam = DB.find('exams', att.exam_id);
  if(exam.teacher_id !== sess.id && sess.role!=='super_admin'){ toast('You are not authorized to mark this examination.','error'); return; }
  const student = DB.find('students', att.student_id);
  const qs = DB.findWhere('questions', q=> q.exam_id===att.exam_id).sort((a,b)=>a.order-b.order);
  const answers = DB.findWhere('answers', a=> a.attempt_id===attemptId);

  Views.shell(`
    <div class="page">
      <div class="flex-between mb2">
        <div>
          <h2 style="margin:0">Marking: ${escapeHtml(student.name)}</h2>
          <div class="sub">${escapeHtml(exam.title)} · ${escapeHtml(exam.subject)}</div>
        </div>
        <div class="t-right">
          <div class="t-tiny t-muted">Auto-marked</div>
          <div class="t-bold t-mint" style="font-size:1.4rem">${att.auto_marks}</div>
        </div>
      </div>

      <div class="alert alert-info">
        <b>Student:</b> ${escapeHtml(student.name)} (${escapeHtml(student.admission_number)}) · ${escapeHtml(clsName(student.class_id))}<br>
        <b>Submitted:</b> ${fmtDate(att.submitted_at)} (${att.submission_reason==='TIME_EXPIRED'?'auto-submitted on time expiry':'manual submit'})
      </div>

      ${qs.map((q,i)=>{
        const a = answers.find(x=>x.question_id===q.id);
        const val = a? a.value : null;
        const res = a? a.auto_result : Q.autoMark(q, val);
        let displayVal = '';
        if(val!==null && val!==undefined){
          if(Array.isArray(val)) displayVal = val.join(', ');
          else if(typeof val==='object') displayVal = Object.entries(val).map(([k,v])=>`${k} → ${v}`).join('<br>');
          else displayVal = String(val);
        }
        const isManual = res && res.pending;
        return `<div class="card mb2">
          <div class="flex-between mb1">
            <span class="badge badge-gray">Q${i+1}</span>
            <span class="badge badge-blue">${Q_TYPES[q.type]?.label}</span>
            <span class="badge badge-green">${q.marks} marks</span>
            ${isManual?'<span class="badge badge-yellow">Manual</span>':'<span class="badge badge-gray">Auto</span>'}
          </div>
          ${q.passage_text?`<div class="passage"><h4>${escapeHtml(q.passage_title||'Passage')}</h4>${q.passage_text.split('\n').map(p=>`<p>${escapeHtml(p)}</p>`).join('')}</div>`:''}
          ${(q.media&&q.media.image)?`<div class="t-center mb1"><img src="${escapeHtml(q.media.image)}" style="max-width:100%;max-height:200px;border-radius:6px;border:1px solid var(--ink-200)"></div>`:(q.picture_emoji?`<div class="t-center mb1" style="font-size:3rem">${q.picture_emoji}</div>`:'')}
          ${(q.media&&q.media.audio)?`<div class="card mb1" style="background:var(--mint-soft)"><div class="t-tiny t-muted mb1">🎧 Dictation audio</div><audio controls src="${escapeHtml(q.media.audio)}" style="width:100%"></audio></div>`:''}
          <div class="t-bold mb1">${escapeHtml(q.prompt)}</div>
          ${q.options?`<div class="mb1">${q.options.map(o=>{ const cls=o===q.correct?'t-mint t-bold':(o===val?'t-bold':''); return `<div class="t-small ${cls}">${escapeHtml(o)} ${o===q.correct?'✓':''}</div>`; }).join('')}</div>`:''}
          <div class="card" style="background:var(--cream-deep); padding:.6rem">
            <div class="t-tiny t-muted">Student answer</div>
            <div>${displayVal?escapeHtml(displayVal).replace(/\n/g,'<br>'):'<i class="t-muted">No answer</i>'}</div>
          </div>
          ${q.rubric?`<div class="alert alert-info t-small mt1"><b>Rubric:</b> ${escapeHtml(q.rubric)}</div>`:''}
          ${isManual?`
            <div class="grid grid-3 mt1" style="align-items:end">
              <div class="field" style="margin:0">
                <label>Award marks (0–${q.marks})</label>
                <input type="number" min="0" max="${q.marks}" step="0.5" class="input" id="mk_${q.id}" value="${a?a.awarded:0}" oninput="document.getElementById('mk_out_${q.id}').textContent=this.value">
              </div>
              <div class="field" style="margin:0">
                <label>Teacher feedback (optional)</label>
                <input class="input" id="fb_${q.id}" value="${escapeHtml(a?a.teacher_feedback:'')}">
              </div>
              <button class="btn btn-primary" onclick="Views._saveMark('${a?a.id:''}','${q.id}', ${q.marks})">Save mark</button>
            </div>
          `:`
            <div class="t-right mt1 t-small t-muted">Auto-marked: ${res.awarded||0}/${q.marks} ${res.note?'· '+escapeHtml(res.note):''}</div>
          `}
        </div>`;
      }).join('')}

      <div class="card mt2" style="background:var(--mint-soft)">
        <div class="flex-between">
          <div>
            <div class="t-tiny t-muted">Current total</div>
            <div class="t-bold" style="font-size:2rem;color:var(--mint-dark)" id="total_display">${att.total_marks}</div>
            <div class="t-small t-muted">out of ${att.max_marks}</div>
          </div>
          <div>
            <a href="#/teacher" class="btn btn-ghost">Back</a>
            ${att.status==='MARKED' && !att.approved?`<button class="btn btn-primary" onclick="Views._approve('${att.id}', true)">Approve result</button>`:''}
            ${att.status==='AWAITING_MARKING'?`<button class="btn btn-blue" onclick="Views._finalizeMarking('${att.id}')">Finalize marking</button>`:''}
          </div>
        </div>
      </div>
    </div>`);
};
Views._saveMark = (answerId, qid, max)=>{
  const v = parseFloat(document.getElementById('mk_'+qid).value)||0;
  const fb = document.getElementById('fb_'+qid).value;
  if(v<0 || v>max){ toast(`Marks must be between 0 and ${max}.`,'warn'); return; }
  // Find answer by attempt+question if no id (new)
  const att = DB.find('attempts', Exam._state.attemptId || (location.hash.split('/').pop()));
  let a = answerId? DB.find('answers', answerId) : DB.firstWhere('answers', x=>x.attempt_id===(location.hash.split('/').pop()) && x.question_id===qid);
  if(!a){
    a = DB.insert('answers', { attempt_id: location.hash.split('/').pop(), question_id:qid, value:null, saved_at:nowISO() });
  }
  Exam.teacherMark(a.id, v, fb);
  toast(`Mark saved: ${v}/${max}`,'success');
  // Update display
  const att2 = DB.find('attempts', a.attempt_id);
  const el = document.getElementById('total_display');
  if(el) el.textContent = att2.total_marks;
};
Views._finalizeMarking = (attId)=>{
  Exam._recomputeAttempt(attId);
  const att = DB.find('attempts', attId);
  if(att.status==='MARKED'){ toast('Marking finalized. You can now approve.','success'); Views.marking(attId); }
  else { toast('Some answers are not yet marked.','warn'); }
};

Views.approvalQueue = ()=>{
  const sess = Auth.current();
  const atts = DB.findWhere('attempts', a=>{
    const e = DB.find('exams', a.exam_id);
    return e && (e.teacher_id===sess.id || sess.role==='super_admin') && a.status==='MARKED' && !a.approved;
  });
  Views.shell(`
    <div class="page">
      <h2 class="mb2">Approval queue</h2>
      ${atts.length===0?`<div class="empty"><div class="ico">✓</div><h3>Nothing to approve</h3><p>Marked results awaiting your approval will appear here.</p></div>`:`
        <div class="table-wrap">
          <table class="table">
            <thead><tr><th>Student</th><th>Examination</th><th>Score</th><th>Marked</th><th></th></tr></thead>
            <tbody>
              ${atts.map(a=>{
                const s = DB.find('students', a.student_id); const e = DB.find('exams', a.exam_id);
                const pct = a.max_marks?Math.round(a.total_marks/a.max_marks*100):0;
                return `<tr><td>${escapeHtml(s.name)}</td><td>${escapeHtml(e.title)}</td><td><b>${a.total_marks}</b>/${a.max_marks} (${pct}%)</td><td class="t-small">${fmtDateShort(a.updated_at)}</td>
                <td>
                  <a href="#/marking/${a.id}" class="btn btn-ghost btn-sm">Review</a>
                  <button class="btn btn-primary btn-sm" onclick="Views._approve('${a.id}', true)">Approve</button>
                  <button class="btn btn-danger btn-sm" onclick="Views._approve('${a.id}', false)">Reject</button>
                </td></tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>`}
    </div>`);
};
Views._approve = (attId, ok)=>{
  const att = DB.find('attempts', attId);
  if(!att) return;
  let feedback = '';
  if(!ok){
    // simple prompt via modal
    openModal('Reject result', `
      <p>Provide a reason for rejecting this result. The student will not see the score, but the teacher will need to re-mark or follow up.</p>
      <textarea id="rj_fb" class="input" placeholder="Reason for rejection..."></textarea>
      <button class="btn btn-danger btn-block mt2" onclick="Views._doApprove('${attId}', false, document.getElementById('rj_fb').value)">Confirm reject</button>
    `);
    return;
  }
  Views._doApprove(attId, true, '');
};
Views._doApprove = (attId, ok, feedback)=>{
  Exam.approve(attId, ok, feedback);
  toast(ok?'Result approved. You can now publish it.':'Result rejected.','success');
  if(ok){
    // Offer publish
    confirmDialog('Publish this result to the student now?', ()=>{ Exam.publish(attId); toast('Result published.','success'); Views.approvalQueue(); }, {title:'Publish result?'});
  } else {
    Views.approvalQueue();
  }
};

/* ---------- TEACHER REPORTS ---------- */
Views.teacherReports = ()=>{
  const sess = Auth.current();
  const exams = DB.findWhere('exams', e=> e.teacher_id===sess.id);
  const rows = [];
  exams.forEach(e=>{
    const atts = DB.findWhere('attempts', a=> a.exam_id===e.id);
    const submitted = atts.filter(a=> ['MARKED','APPROVED','PUBLISHED','AWAITING_MARKING'].includes(a.status));
    const published = atts.filter(a=> a.status==='PUBLISHED');
    const avg = submitted.length? Math.round(submitted.reduce((s,a)=>s+a.total_marks,0)/submitted.length*10)/10 : 0;
    const passRate = submitted.length? Math.round(submitted.filter(a=> e.pass_mark && a.total_marks>=e.pass_mark).length/submitted.length*100) : 0;
    rows.push({ exam:e, total:atts.length, submitted:submitted.length, published:published.length, avg, passRate, max:e.total_marks });
  });

  Views.shell(`
    <div class="page">
      <h2 class="mb2">Performance reports <button class="btn btn-ghost btn-sm" style="margin-left:.5rem;vertical-align:middle" onclick="Views._downloadTeacherReportCSV()">Download all (CSV)</button></h2>
      <div class="card mb2">
        <h3>Examination summary</h3>
        <div class="table-wrap">
          <table class="table">
            <thead><tr><th>Examination</th><th>Class</th><th>Attempts</th><th>Submitted</th><th>Published</th><th>Avg score</th><th>Pass rate</th></tr></thead>
            <tbody>
              ${rows.length===0?`<tr><td colspan="7" class="t-center t-muted">No data yet.</td></tr>`:rows.map(r=>`
                <tr>
                  <td>${escapeHtml(r.exam.title)}</td>
                  <td>${escapeHtml(clsName(r.exam.class_id))}</td>
                  <td>${r.total}</td>
                  <td>${r.submitted}</td>
                  <td>${r.published}</td>
                  <td>${r.avg}/${r.max}</td>
                  <td>${r.passRate}%</td>
                </tr>`).join('')}
            </tbody>
          </table>
        </div>
      </div>

      <div class="card">
        <h3>Per-student breakdown</h3>
        <div class="table-wrap">
          <table class="table">
            <thead><tr><th>Student</th><th>Class</th><th>Examination</th><th>Score</th><th>Status</th></tr></thead>
            <tbody>
              ${exams.flatMap(e=> DB.findWhere('attempts', a=> a.exam_id===e.id).map(a=>{
                const s = DB.find('students', a.student_id);
                return `<tr><td>${escapeHtml(s.name)}</td><td>${escapeHtml(clsName(s.class_id))}</td><td>${escapeHtml(e.title)}</td><td>${a.status==='PUBLISHED'?a.total_marks+'/'+a.max_marks:'—'}</td><td><span class="badge ${a.status==='PUBLISHED'?'badge-green':a.status==='REJECTED'?'badge-red':'badge-yellow'}">${ATTEMPT_STATUS[a.status]}</span></td></tr>`;
              })).join('') || '<tr><td colspan="5" class="t-center t-muted">No attempts yet.</td></tr>'}
            </tbody>
          </table>
        </div>
      </div>
    </div>`);
};

Views._subjectSeedDefaults = ()=>{

/* ============================================================
   DOWNLOAD / EXPORT  (results, reports, examinations)
   - CSV: self-contained Blob download, no dependencies.
   - PDF: opens a clean printable window and triggers the browser
     print dialog ("Save as PDF"). No external libraries required.
   ============================================================ */
Views._safeName = (s)=> (s||'document').replace(/[^a-z0-9]+/gi,'_').replace(/^_+|_+$/g,'').slice(0,40) || 'document';
Views._downloadCSV = (filename, rows)=>{
  const csv = rows.map(r=> r.map(c=>{
    const s = (c===null||c===undefined)?'':String(c);
    return /[",\n]/.test(s)? '"'+s.replace(/"/g,'""')+'"' : s;
  }).join(',')).join('\r\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('Downloaded '+filename,'success');
};
Views._printDoc = (title, bodyHtml)=>{
  const w = window.open('', '_blank');
  if(!w){ toast('Pop-up blocked. Allow pop-ups to print/download.','error'); return; }
  w.document.write('<!doctype html><html><head><meta charset="utf-8"><title>'+escapeHtml(title)+'</title>'+
  '<style>'+
    '@page{margin:14mm}'+
    'body{font-family:Georgia,Times New Roman,serif;color:#222;max-width:780px;margin:1.2rem auto;padding:0 1rem;line-height:1.5}'+
    'h1{font-size:1.4rem;margin:0 0 .2rem} h2{font-size:1.05rem;margin:1rem 0 .3rem}'+

    '.meta{font-size:.82rem;color:#555;margin:.2rem 0}'+
    'table{border-collapse:collapse;width:100%;font-size:.82rem;margin:.5rem 0}'+
    'th,td{border:1px solid #bbb;padding:.3rem .4rem;text-align:left;vertical-align:top} th{background:#eee}'+
    '.q{border:1px solid #ccc;padding:.6rem;margin:.5rem 0;border-radius:4px;page-break-inside:avoid}'+
    '.prompt{font-weight:bold;margin-bottom:.3rem} .ans{margin:.15rem 0 .15rem 1rem}'+
    '.correct{color:#1a7d4b;font-weight:bold} .wrong{color:#b00020;font-weight:bold}'+

  '</style></head><body>'+bodyHtml+'<script>window.onload=function(){setTimeout(function(){window.print()},250)}<\/'+'script></body></html>');
  w.document.close();
};

Views._printExam = (examId)=>{

    '<h1>'+escapeHtml(exam.title)+'</h1>'+
    '<div class="meta">'+escapeHtml(exam.subject)+' · '+escapeHtml(clsName(exam.class_id))+' · '+escapeHtml(exam.category||'')+' · '+escapeHtml(exam.term||'')+' · '+escapeHtml(exam.academic_year||'')+'</div>'+

      else if(q.type==='FILL'){ opts='<div class="ans meta">'+(q.blanks||1)+' blank'+((q.blanks||1)===1?'':'s')+' to fill</div>'; }
      else if(q.type==='MATCHING'){ opts='<div class="ans meta">Match: '+escapeHtml((q.left_items||[]).join(', '))+' &nbsp;→&nbsp; '+escapeHtml((q.right_items||[]).join(', '))+((q.media&&q.media.left_images&&q.media.left_images.filter(Boolean).length)?' &nbsp;(images attached)':'')+'</div>'; }

    rows.push([c.name, atts.length, avg]);
  });
  rows.push([],['ALL EXAMINATIONS'],['Title','Class','Teacher','Status','Attempts']);
  exams.forEach(e=>{
    const t = DB.find('users', e.teacher_id);
    rows.push([e.title, clsName(e.class_id), t?t.name:'—', EXAM_STATUS[e.status]||e.status, DB.findWhere('attempts',a=>a.exam_id===e.id).length]);
  });
  Views._downloadCSV('School_Report_'+Views._safeName(APP.schoolName)+'.csv', rows);
};

Views.adminReports = ()=>{
  const exams = DB.all('exams');
  const totalAttempts = DB.all('attempts').length;
  const published = DB.findWhere('attempts', a=>a.status==='PUBLISHED');
  const avgScore = published.length? Math.round(published.reduce((s,a)=>s+a.total_marks,0)/published.length*10)/10 : 0;
  const byClass = DB.all('classes').map(c=>{
    const atts = DB.findWhere('attempts', a=>a.class_id===c.id && a.status==='PUBLISHED');
    return { class:c.name, count:atts.length, avg: atts.length?Math.round(atts.reduce((s,a)=>s+a.total_marks,0)/atts.length*10)/10:0 };
  });

  Views.shell(`
    <div class="page">
      <h2 class="mb2">School-wide reports <button class="btn btn-ghost btn-sm" style="margin-left:.5rem;vertical-align:middle" onclick="Views._downloadAdminReportCSV()">Download school report (CSV)</button></h2>
      <div class="grid grid-3 mb3">
        <div class="card"><div class="stat"><div class="v">${totalAttempts}</div><div class="l">Total attempts</div></div></div>
        <div class="card"><div class="stat"><div class="v">${published.length}</div><div class="l">Published results</div></div></div>
        <div class="card"><div class="stat"><div class="v">${avgScore}</div><div class="l">Avg published score</div></div></div>
      </div>

      <div class="card mb2">
        <h3>Performance by class</h3>
        <div class="table-wrap">
          <table class="table">
            <thead><tr><th>Class</th><th>Published results</th><th>Average score</th></tr></thead>
            <tbody>
              ${byClass.map(r=>`<tr><td>${escapeHtml(r.class)}</td><td>${r.count}</td><td>${r.avg}</td></tr>`).join('')}
            </tbody>
          </table>
        </div>
      </div>

      <div class="card">
        <h3>All examinations</h3>
        <div class="table-wrap">
          <table class="table">
            <thead><tr><th>Title</th><th>Class</th><th>Teacher</th><th>Status</th><th>Attempts</th></tr></thead>
            <tbody>
              ${exams.map(e=>{
                const t = DB.find('users', e.teacher_id);
                return `<tr><td>${escapeHtml(e.title)}</td><td>${escapeHtml(clsName(e.class_id))}</td><td>${escapeHtml(t?t.name:'—')}</td><td><span class="badge ${e.status==='PUBLISHED'?'badge-green':'badge-gray'}">${EXAM_STATUS[e.status]}</span></td><td>${DB.findWhere('attempts',a=>a.exam_id===e.id).length}</td></tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>
      </div>
    </div>`);
};

/* ============================================================
   10. APP INIT — async boot
   ------------------------------------------------------------
   Flow:
     1. Show loading splash.
     2. Try DB.init() (connects to Supabase).
     3. If Supabase connected and fetched OK → restore any
        existing auth session, then start the router.
     4. If Supabase configured but fetch failed → show setup
        screen with the error.
     5. If Supabase not configured at all → show setup screen
        with configuration instructions.
   ============================================================ */
async function boot(){
  // Loading splash
  document.getElementById('app').innerHTML = `
    <div class="splash">
      <div class="logo">KE</div>
      <h1>${escapeHtml(APP.schoolName)}</h1>
      <div class="spinner" style="border-color:rgba(255,255,255,.3);border-top-color:#fff;margin:0 auto 1rem"></div>
      <p>Connecting to Supabase…</p>
    </div>`;

  const result = await DB.init();

  if(result.ok && result.mode==='supabase'){
    // Restore any existing app-level session (from sessionStorage)
    await Auth.restoreSession();
    // NOTE: we deliberately do NOT auto-submit IN_PROGRESS attempts on boot.
    // The active-session timer pauses when the browser is closed, so a student
    // who lost internet / closed the browser simply signs back in and resumes
    // where they left off (remaining time is restored from localStorage).
    // Legitimate time-out is handled by the timer while the student is present.
    Router.init();
  } else if(result.mode==='supabase' && !result.ok){
    // Configured but fetch failed
    Views.setup(result.error || 'Could not fetch data from Supabase. Check that the migrations have been applied and RLS policies allow your anon key to read.');
  } else {
    // Not configured at all
    Views.setup();
  }
}

boot();

</script>
