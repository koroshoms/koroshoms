};
Views._qEditorTypeChange = (existing)=>{
  const t = document.getElementById('q_type').value;
  const wrap = document.getElementById('q_type_fields');
  const q = existing || window._editorQuestions[parseInt((location.hash.match(/edit\-(\d+)/)||[])[1]||'-1')] || { options:['','','',''], correct:'', accepted_answers:[['']], left_items:['',''], right_items:['',''], correct_pairs:{}, blanks:1, picture_emoji:'', picture_caption:'', passage_title:'', passage_text:'' };
  let html='';
  switch(t){
    case 'MCQ':
    case 'PICTURE':
      html += `<div class="field"><label>Options (one per line, at least 2)</label>
        <textarea id="q_options" class="input" style="min-height:120px">${(q.options||[]).join('\n')}</textarea></div>
        <div class="field"><label>Correct answer</label><input id="q_correct" class="input" value="${escapeHtml(q.correct||'')}"></div>`;
      if(t==='PICTURE'){
        html += `<div class="field"><label>Picture (emoji or short text)</label><input id="q_pic" class="input" value="${escapeHtml(q.picture_emoji||'')}" placeholder="e.g. 🐘"></div>
                 <div class="field"><label>Picture caption</label><input id="q_piccap" class="input" value="${escapeHtml(q.picture_caption||'')}"></div>`;
      }
      break;
    case 'TRUE_FALSE':
      html += `<div class="field"><label>Correct answer</label>
        <select id="q_tf" class="input"><option value="true" ${q.correct===true||q.correct==='true'?'selected':''}>True</option><option value="false" ${q.correct===false||q.correct==='false'?'selected':''}>False</option></select></div>`;
      break;
    case 'FILL':
      html += `<div class="field"><label>Number of blanks</label><input id="q_blanks" type="number" min="1" max="10" class="input" value="${q.blanks||1}"></div>
        <div class="field"><label>Accepted answers — one set per line, alternatives separated by | (e.g. <code>8 | eight</code>)</label>
        <textarea id="q_accepted" class="input" style="min-height:100px">${(q.accepted_answers||[['']]).map(a=>a.join(' | ')).join('\n')}</textarea></div>
        <div class="row">
          <label class="check"><input type="checkbox" id="q_case" ${q.case_sensitive?'checked':''}> Case sensitive</label>
          <label class="check"><input type="checkbox" id="q_trim" ${q.trim_whitespace!==false?'checked':''}> Trim whitespace</label>
          <label class="check"><input type="checkbox" id="q_partial" ${q.partial_marking?'checked':''}> Partial marking</label>
        </div>`;
      break;
    case 'SHORT':
      html += `<div class="field"><label>Accepted answers (optional — pipe-separated for alternatives). Leave empty for manual marking.</label>
        <input id="q_short_acc" class="input" value="${escapeHtml((q.accepted_answers||[]).flat().join(' | '))}" placeholder="e.g. 8 | eight"></div>
        <div class="row">
          <label class="check"><input type="checkbox" id="q_auto" ${q.auto_markable?'checked':''}> Auto-mark if exact match</label>
          <label class="check"><input type="checkbox" id="q_case" ${q.case_sensitive?'checked':''}> Case sensitive</label>
        </div>
        <div class="field"><label>Numeric tolerance (for maths; 0 = exact)</label><input id="q_tol" type="number" step="any" class="input" value="${q.numeric_tolerance||0}"></div>
        <div class="field"><label>Marking rubric / guide (teacher only)</label><textarea id="q_rubric" class="input">${escapeHtml(q.rubric||'')}</textarea></div>`;
      break;
    case 'MATCHING':
      html += `<div class="field"><label>Left items (one per line)</label><textarea id="q_left" class="input" style="min-height:100px">${(q.left_items||[]).join('\n')}</textarea></div>
        <div class="field"><label>Right items (one per line — will be shuffled for students)</label><textarea id="q_right" class="input" style="min-height:100px">${(q.right_items||[]).join('\n')}</textarea></div>
        <div class="field"><label>Correct pairs — format: left = right (one per line)</label>
          <textarea id="q_pairs" class="input" style="min-height:120px">${Object.entries(q.correct_pairs||{}).map(([l,r])=>`${l} = ${r}`).join('\n')}</textarea></div>
        <label class="check"><input type="checkbox" id="q_partial" ${q.partial_marking?'checked':''}> Partial marking</label>`;
      break;
    case 'READING':
      html += `<div class="field"><label>Passage title</label><input id="q_ptitle" class="input" value="${escapeHtml(q.passage_title||'')}"></div>
        <div class="field"><label>Passage text (use blank lines between paragraphs)</label><textarea id="q_ptext" class="input" style="min-height:160px">${escapeHtml(q.passage_text||'')}</textarea></div>
        <div class="field"><label>Question type under this passage</label>
          <select id="q_subt" class="input" onchange="Views._qReadingSubChange()">
            <option value="MCQ" ${(q.options&&!q.accepted_answers)?'selected':''}>Multiple choice</option>
            <option value="SHORT" ${(q.accepted_answers||q.rubric)?'selected':''}>Short written answer</option>
          </select>
        </div>
        <div id="q_reading_sub"></div>`;
      break;
    case 'WRITING':
      html += `<div class="field"><label>Minimum words</label><input id="q_minw" type="number" min="0" class="input" value="${q.min_words||0}"></div>
        <div class="field"><label>Suggested words</label><input id="q_sugw" type="number" class="input" value="${q.suggested_words||''}"></div>
        <div class="field"><label>Maximum words</label><input id="q_maxw" type="number" class="input" value="${q.max_words||''}"></div>
        <div class="field"><label>Marking rubric (teacher only)</label><textarea id="q_rubric" class="input" style="min-height:120px">${escapeHtml(q.rubric||'')}</textarea></div>`;
      break;
  }
  wrap.innerHTML = html;
  if(t==='READING') Views._qReadingSubChange(q);
};
Views._qReadingSubChange = (q)=>{
  const subt = document.getElementById('q_subt').value;
  const wrap = document.getElementById('q_reading_sub');
  if(subt==='MCQ'){
    wrap.innerHTML = `<div class="field"><label>Options (one per line)</label><textarea id="q_options" class="input" style="min-height:100px">${((q&&q.options)||[]).join('\n')}</textarea></div>
      <div class="field"><label>Correct answer</label><input id="q_correct" class="input" value="${escapeHtml((q&&q.correct)||'')}"></div>`;
  } else {
    wrap.innerHTML = `<div class="field"><label>Accepted answers (pipe-separated, optional)</label><input id="q_short_acc" class="input" value="${escapeHtml((q&&q.accepted_answers&&q.accepted_answers.flat()||[]).join(' | '))}"></div>
      <div class="field"><label>Marking rubric</label><textarea id="q_rubric" class="input">${escapeHtml((q&&q.rubric)||'')}</textarea></div>
      <label class="check"><input type="checkbox" id="q_auto" ${(q&&q.auto_markable)?'checked':''}> Auto-mark if exact match</label>`;
  }
};
Views._qEditorSave = (idx)=>{
  const t = document.getElementById('q_type').value;
  const marks = parseInt(document.getElementById('q_marks').value)||1;
  const prompt = document.getElementById('q_prompt').value.trim();
  const topic = document.getElementById('q_topic').value.trim();
  if(!prompt){ toast('Prompt is required.','warn'); return; }
  const q = { type:t, marks, prompt, topic, auto_markable: Q_TYPES[t].autoMarkable===true };
  switch(t){
    case 'MCQ': case 'PICTURE':
      q.options = document.getElementById('q_options').value.split('\n').map(s=>s.trim()).filter(Boolean);
      q.correct = document.getElementById('q_correct').value.trim();
      if(q.options.length<2){ toast('Add at least 2 options.','warn'); return; }
      if(!q.options.includes(q.correct)){ toast('Correct answer must match one option.','warn'); return; }
      if(t==='PICTURE'){ q.picture_emoji=document.getElementById('q_pic').value; q.picture_caption=document.getElementById('q_piccap').value; }
      break;
    case 'TRUE_FALSE':
      q.correct = document.getElementById('q_tf').value==='true';
      break;
    case 'FILL':
      q.blanks = parseInt(document.getElementById('q_blanks').value)||1;
      q.accepted_answers = document.getElementById('q_accepted').value.split('\n').map(l=>l.split('|').map(s=>s.trim()).filter(Boolean));
      q.case_sensitive = document.getElementById('q_case').checked;
      q.trim_whitespace = document.getElementById('q_trim').checked;
      q.partial_marking = document.getElementById('q_partial').checked;
      if(q.accepted_answers.length < q.blanks){ toast('Provide accepted answers for each blank.','warn'); return; }
      break;
    case 'SHORT':
      const acc = document.getElementById('q_short_acc').value.trim();
      if(acc){ q.accepted_answers = [acc.split('|').map(s=>s.trim()).filter(Boolean)]; q.auto_markable = document.getElementById('q_auto').checked; }
      else { q.auto_markable = false; }
      q.case_sensitive = document.getElementById('q_case').checked;
      q.numeric_tolerance = parseFloat(document.getElementById('q_tol').value)||0;
      q.rubric = document.getElementById('q_rubric').value;
      q.manual_marking = !q.auto_markable;
      break;
    case 'MATCHING':
      q.left_items = document.getElementById('q_left').value.split('\n').map(s=>s.trim()).filter(Boolean);
      q.right_items = document.getElementById('q_right').value.split('\n').map(s=>s.trim()).filter(Boolean);
      q.correct_pairs = {};
      document.getElementById('q_pairs').value.split('\n').forEach(l=>{ const m=l.split('='); if(m.length===2) q.correct_pairs[m[0].trim()]=m[1].trim(); });
      q.partial_marking = document.getElementById('q_partial').checked;
      if(q.left_items.length<2 || q.right_items.length<2){ toast('Add at least 2 items in each column.','warn'); return; }
      if(Object.keys(q.correct_pairs).length!==q.left_items.length){ toast('Provide a correct pair for each left item.','warn'); return; }
      break;
    case 'READING':
      q.passage_title = document.getElementById('q_ptitle').value.trim();
      q.passage_text = document.getElementById('q_ptext').value;
      const subt = document.getElementById('q_subt').value;
      if(subt==='MCQ'){
        q.options = document.getElementById('q_options').value.split('\n').map(s=>s.trim()).filter(Boolean);
        q.correct = document.getElementById('q_correct').value.trim();
        q.auto_markable = true;
      } else {
        const acc = document.getElementById('q_short_acc').value.trim();
        if(acc){ q.accepted_answers = [acc.split('|').map(s=>s.trim()).filter(Boolean)]; q.auto_markable = document.getElementById('q_auto').checked; }
        else { q.auto_markable = false; }
        q.rubric = document.getElementById('q_rubric').value;
        q.manual_marking = !q.auto_markable;
      }
      break;
    case 'WRITING':
      q.min_words = parseInt(document.getElementById('q_minw').value)||0;
      q.suggested_words = parseInt(document.getElementById('q_sugw').value)||0;
      q.max_words = parseInt(document.getElementById('q_maxw').value)||0;
      q.rubric = document.getElementById('q_rubric').value;
      q.auto_markable = false; q.manual_marking = true;
      break;
  }
  if(idx>=0){ window._editorQuestions[idx] = Object.assign(window._editorQuestions[idx], q); }
  else { window._editorQuestions.push(q); }
  closeModal();
  Views._examEditorRenderQuestions();
  toast('Question saved.','success');
};
Views._examEditorDelQuestion = (idx)=>{
  confirmDialog('Delete this question?', ()=>{ window._editorQuestions.splice(idx,1); Views._examEditorRenderQuestions(); toast('Question deleted.','success'); }, {danger:true});
};

Views._examEditorSave = (status)=>{
  const sess = Auth.current();
  const title = document.getElementById('e_title').value.trim();
  if(!title){ toast('Title is required.','warn'); return; }
  const opens = document.getElementById('e_opens').value;
  const closes = document.getElementById('e_closes').value;
  if(!opens||!closes){ toast('Opening and closing times are required.','warn'); return; }
  if(new Date(opens) >= new Date(closes)){ toast('Closing time must be after opening time.','warn'); return; }
  if(window._editorQuestions.length===0){ toast('Add at least one question.','warn'); return; }
  const totalMarks = window._editorQuestions.reduce((s,q)=>s+(q.marks||0),0);
  const examId = (location.hash.match(/edit\/([^/]+)/)||[])[1];
  const payload = {
    title, class_id:document.getElementById('e_class').value, subject:document.getElementById('e_subj').value,
    category:document.getElementById('e_cat').value, term:document.getElementById('e_term').value,
    academic_year:document.getElementById('e_year').value.trim(),
    exam_date:opens, opens_at:new Date(opens).toISOString(), closes_at:new Date(closes).toISOString(),
    duration_minutes:parseInt(document.getElementById('e_dur').value)||30,
    total_marks:totalMarks,
    pass_mark:parseInt(document.getElementById('e_pass').value)||0,
    attempts_allowed:parseInt(document.getElementById('e_att').value)||1,
    instructions:document.getElementById('e_instr').value,
    timing_policy:document.getElementById('e_pol').value,
    navigation_rule:document.getElementById('e_nav').value,
    randomize_questions:document.getElementById('e_rq').checked,
    randomize_options:document.getElementById('e_ro').checked,
    require_approval:document.getElementById('e_ap').checked,
    status, teacher_id:sess.id
  };
  if(totalMarks !== parseInt(document.getElementById('e_marks').value)){
    // sync total marks to sum of question marks
    payload.total_marks = totalMarks;
  }

  let exam;
  if(examId && DB.find('exams', examId)){
    exam = DB.update('exams', examId, payload);
    // Replace questions
    DB.remove('questions', null); // no-op without id; do properly:
    DB.findWhere('questions', q=>q.exam_id===examId).forEach(q=> DB.remove('questions', q.id));
  } else {
    exam = DB.insert('exams', payload);
  }
  window._editorQuestions.forEach((q,i)=> DB.insert('questions', Object.assign({}, q, { exam_id:exam.id, order:i+1 })) );
  window._editorQuestions = null;
  DB.audit(status==='PUBLISHED'?'EXAM_PUBLISH':'EXAM_SAVE', sess.id, sess.role, { exam_id:exam.id });
  toast(status==='PUBLISHED'?'Examination published. Students can now start it during the open window.':'Saved as draft.','success');
  location.hash = '#/teacher';
};

/* ---------- EXAM PREVIEW ---------- */
Views.examPreview = (examId)=>{
  const exam = DB.find('exams', examId);
  if(!exam){ toast('Examination not found.','error'); return; }
  const qs = DB.findWhere('questions', q=> q.exam_id===examId).sort((a,b)=>a.order-b.order);

/* ---------- MARKING ---------- */
Views.marking = (attemptId)=>{
  const sess = Auth.current();
  const att = DB.find('attempts', attemptId);
  if(!att){ toast('Attempt not found.','error'); return; }
  const exam = DB.find('exams', att.exam_id);
  if(exam.teacher_id !== sess.id && sess.role!=='super_admin'){ toast('You are not authorized to mark this examination.','error'); return; }
  const student = DB.find('students', att.student_id);
  const qs = DB.findWhere('questions', q=> q.exam_id===att.exam_id).sort((a,b)=>a.order-b.order);
  const answers = DB.findWhere('answers', a=> a.attempt_id===attemptId);

  Views.shell(`
    <div class="page">
      <div class="flex-between mb2">
        <div>
          <h2 style="margin:0">Marking: ${escapeHtml(student.name)}</h2>
          <div class="sub">${escapeHtml(exam.title)} · ${escapeHtml(exam.subject)}</div>
        </div>
        <div class="t-right">
          <div class="t-tiny t-muted">Auto-marked</div>
          <div class="t-bold t-green" style="font-size:1.4rem">${att.auto_marks}</div>
        </div>
      </div>

      <div class="alert alert-info">
        <b>Student:</b> ${escapeHtml(student.name)} (${escapeHtml(student.admission_number)}) · ${escapeHtml(clsName(student.class_id))}<br>
        <b>Submitted:</b> ${fmtDate(att.submitted_at)} (${att.submission_reason==='TIME_EXPIRED'?'auto-submitted on time expiry':'manual submit'})
      </div>

      ${qs.map((q,i)=>{
        const a = answers.find(x=>x.question_id===q.id);
        const val = a? a.value : null;
        const res = a? a.auto_result : Q.autoMark(q, val);
        let displayVal = '';
        if(val!==null && val!==undefined){
          if(typeof val==='object') displayVal = Object.entries(val).map(([k,v])=>`${k} → ${v}`).join('<br>');
          else if(Array.isArray(val)) displayVal = val.join(', ');
          else displayVal = String(val);
        }
        const isManual = res && res.pending;
        return `<div class="card mb2">
          <div class="flex-between mb1">
            <span class="badge badge-gray">Q${i+1}</span>
            <span class="badge badge-blue">${Q_TYPES[q.type]?.label}</span>
            <span class="badge badge-green">${q.marks} marks</span>
            ${isManual?'<span class="badge badge-yellow">Manual</span>':'<span class="badge badge-gray">Auto</span>'}
          </div>
          ${q.passage_text?`<div class="passage"><h4>${escapeHtml(q.passage_title||'Passage')}</h4>${q.passage_text.split('\n').map(p=>`<p>${escapeHtml(p)}</p>`).join('')}</div>`:''}
          ${q.picture_emoji?`<div class="t-center mb1" style="font-size:3rem">${q.picture_emoji}</div>`:''}
          <div class="t-bold mb1">${escapeHtml(q.prompt)}</div>
          ${q.options?`<div class="mb1">${q.options.map(o=>{ const cls=o===q.correct?'t-green t-bold':(o===val?'t-bold':''); return `<div class="t-small ${cls}">${escapeHtml(o)} ${o===q.correct?'✓':''}</div>`; }).join('')}</div>`:''}
          <div class="card" style="background:var(--ink-50); padding:.6rem">
            <div class="t-tiny t-muted">Student answer</div>
            <div>${displayVal?escapeHtml(displayVal).replace(/\n/g,'<br>'):'<i class="t-muted">No answer</i>'}</div>
          </div>
          ${q.rubric?`<div class="alert alert-info t-small mt1"><b>Rubric:</b> ${escapeHtml(q.rubric)}</div>`:''}
          ${isManual?`
            <div class="grid grid-3 mt1" style="align-items:end">
              <div class="field" style="margin:0">
                <label>Award marks (0–${q.marks})</label>
                <input type="number" min="0" max="${q.marks}" step="0.5" class="input" id="mk_${q.id}" value="${a?a.awarded:0}" oninput="document.getElementById('mk_out_${q.id}').textContent=this.value">
              </div>
              <div class="field" style="margin:0">
                <label>Teacher feedback (optional)</label>
                <input class="input" id="fb_${q.id}" value="${escapeHtml(a?a.teacher_feedback:'')}">
              </div>
              <button class="btn btn-primary" onclick="Views._saveMark('${a?a.id:''}','${q.id}', ${q.marks})">Save mark</button>
            </div>
          `:`
            <div class="t-right mt1 t-small t-muted">Auto-marked: ${res.awarded||0}/${q.marks} ${res.note?'· '+escapeHtml(res.note):''}</div>
          `}
        </div>`;
      }).join('')}

      <div class="card mt2" style="background:var(--green-50)">
        <div class="flex-between">
          <div>
            <div class="t-tiny t-muted">Current total</div>
            <div class="t-bold" style="font-size:2rem;color:var(--green-800)" id="total_display">${att.total_marks}</div>
            <div class="t-small t-muted">out of ${att.max_marks}</div>
          </div>
          <div>
            <a href="#/teacher" class="btn btn-ghost">Back</a>
            ${att.status==='MARKED' && !att.approved?`<button class="btn btn-primary" onclick="Views._approve('${att.id}', true)">Approve result</button>`:''}
            ${att.status==='AWAITING_MARKING'?`<button class="btn btn-blue" onclick="Views._finalizeMarking('${att.id}')">Finalize marking</button>`:''}
          </div>
        </div>
      </div>
    </div>`);
};
Views._saveMark = (answerId, qid, max)=>{
  const v = parseFloat(document.getElementById('mk_'+qid).value)||0;
  const fb = document.getElementById('fb_'+qid).value;
  if(v<0 || v>max){ toast(`Marks must be between 0 and ${max}.`,'warn'); return; }
  // Find answer by attempt+question if no id (new)
  const att = DB.find('attempts', Exam._state.attemptId || (location.hash.split('/').pop()));
  let a = answerId? DB.find('answers', answerId) : DB.firstWhere('answers', x=>x.attempt_id===(location.hash.split('/').pop()) && x.question_id===qid);
  if(!a){
    a = DB.insert('answers', { attempt_id: location.hash.split('/').pop(), question_id:qid, value:null, saved_at:nowISO() });
  }
  Exam.teacherMark(a.id, v, fb);
  toast(`Mark saved: ${v}/${max}`,'success');
  // Update display
  const att2 = DB.find('attempts', a.attempt_id);
  const el = document.getElementById('total_display');
  if(el) el.textContent = att2.total_marks;
};
Views._finalizeMarking = (attId)=>{
  Exam._recomputeAttempt(attId);
  const att = DB.find('attempts', attId);
  if(att.status==='MARKED'){ toast('Marking finalized. You can now approve.','success'); Views.marking(attId); }
  else { toast('Some answers are not yet marked.','warn'); }
};

Views.approvalQueue = ()=>{
  const sess = Auth.current();
  const atts = DB.findWhere('attempts', a=>{
    const e = DB.find('exams', a.exam_id);
    return e && (e.teacher_id===sess.id || sess.role==='super_admin') && a.status==='MARKED' && !a.approved;
  });
  Views.shell(`
    <div class="page">
      <h2 class="mb2">Approval queue</h2>
      ${atts.length===0?`<div class="empty"><div class="ico">✓</div><h3>Nothing to approve</h3><p>Marked results awaiting your approval will appear here.</p></div>`:`
        <div class="table-wrap">
          <table class="table">
            <thead><tr><th>Student</th><th>Examination</th><th>Score</th><th>Marked</th><th></th></tr></thead>
            <tbody>
              ${atts.map(a=>{
                const s = DB.find('students', a.student_id); const e = DB.find('exams', a.exam_id);
                const pct = a.max_marks?Math.round(a.total_marks/a.max_marks*100):0;
                return `<tr><td>${escapeHtml(s.name)}</td><td>${escapeHtml(e.title)}</td><td><b>${a.total_marks}</b>/${a.max_marks} (${pct}%)</td><td class="t-small">${fmtDateShort(a.updated_at)}</td>
                <td>
                  <a href="#/marking/${a.id}" class="btn btn-ghost btn-sm">Review</a>
                  <button class="btn btn-primary btn-sm" onclick="Views._approve('${a.id}', true)">Approve</button>
                  <button class="btn btn-danger btn-sm" onclick="Views._approve('${a.id}', false)">Reject</button>
                </td></tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>`}
    </div>`);
};
Views._approve = (attId, ok)=>{
  const att = DB.find('attempts', attId);
  if(!att) return;
  let feedback = '';
  if(!ok){
    // simple prompt via modal
    openModal('Reject result', `
      <p>Provide a reason for rejecting this result. The student will not see the score, but the teacher will need to re-mark or follow up.</p>
      <textarea id="rj_fb" class="input" placeholder="Reason for rejection..."></textarea>
      <button class="btn btn-danger btn-block mt2" onclick="Views._doApprove('${attId}', false, document.getElementById('rj_fb').value)">Confirm reject</button>
    `);
    return;
  }
  Views._doApprove(attId, true, '');
};
Views._doApprove = (attId, ok, feedback)=>{
  Exam.approve(attId, ok, feedback);
  toast(ok?'Result approved. You can now publish it.':'Result rejected.','success');
  if(ok){
    // Offer publish
    confirmDialog('Publish this result to the student now?', ()=>{ Exam.publish(attId); toast('Result published.','success'); Views.approvalQueue(); }, {title:'Publish result?'});
  } else {
    Views.approvalQueue();
  }
};

Views.teacherReports = ()=>{
  const sess = Auth.current();
  const exams = DB.findWhere('exams', e=> e.teacher_id===sess.id);
  const rows = [];
  exams.forEach(e=>{
    const atts = DB.findWhere('attempts', a=> a.exam_id===e.id);
    const submitted = atts.filter(a=> ['MARKED','APPROVED','PUBLISHED','AWAITING_MARKING'].includes(a.status));
    const published = atts.filter(a=> a.status==='PUBLISHED');
    const avg = submitted.length? Math.round(submitted.reduce((s,a)=>s+a.total_marks,0)/submitted.length*10)/10 : 0;
    const passRate = submitted.length? Math.round(submitted.filter(a=> e.pass_mark && a.total_marks>=e.pass_mark).length/submitted.length*100) : 0;
    rows.push({ exam:e, total:atts.length, submitted:submitted.length, published:published.length, avg, passRate, max:e.total_marks });
  });

  Views.shell(`
    <div class="page">
      <h2 class="mb2">Performance reports</h2>
      <div class="card mb2">
        <h3>Examination summary</h3>
        <div class="table-wrap">
          <table class="table">
            <thead><tr><th>Examination</th><th>Class</th><th>Attempts</th><th>Submitted</th><th>Published</th><th>Avg score</th><th>Pass rate</th></tr></thead>
            <tbody>
              ${rows.length===0?`<tr><td colspan="7" class="t-center t-muted">No data yet.</td></tr>`:rows.map(r=>`
                <tr>
                  <td>${escapeHtml(r.exam.title)}</td>
                  <td>${escapeHtml(clsName(r.exam.class_id))}</td>
                  <td>${r.total}</td>
                  <td>${r.submitted}</td>
                  <td>${r.published}</td>
                  <td>${r.avg}/${r.max}</td>
                  <td>${r.passRate}%</td>
                </tr>`).join('')}
            </tbody>
          </table>
        </div>
      </div>

      <div class="card">
        <h3>Per-student breakdown</h3>
        <div class="table-wrap">
          <table class="table">
            <thead><tr><th>Student</th><th>Class</th><th>Examination</th><th>Score</th><th>Status</th></tr></thead>
            <tbody>
              ${exams.flatMap(e=> DB.findWhere('attempts', a=> a.exam_id===e.id).map(a=>{
                const s = DB.find('students', a.student_id);
                return `<tr><td>${escapeHtml(s.name)}</td><td>${escapeHtml(clsName(s.class_id))}</td><td>${escapeHtml(e.title)}</td><td>${a.status==='PUBLISHED'?a.total_marks+'/'+a.max_marks:'—'}</td><td><span class="badge ${a.status==='PUBLISHED'?'badge-green':a.status==='REJECTED'?'badge-red':'badge-yellow'}">${ATTEMPT_STATUS[a.status]}</span></td></tr>`;

Views._userSave = async (id)=>{
  const name = document.getElementById('u_name').value.trim();
  const email = document.getElementById('u_email').value.trim();
  const role = document.getElementById('u_role').value;
  const pin = document.getElementById('u_pin').value.trim();
  const active = document.getElementById('u_act').checked;
  if(!name||!email){ toast('Name and email are required.','warn'); return; }
  if(!id && (!pin || pin.length<4)){ toast('PIN is required for new staff (at least 4 digits).','warn'); return; }
  if(pin && pin.length<4){ toast('PIN must be at least 4 digits.','warn'); return; }

  const btn = document.getElementById('u_save_btn');
  if(btn){ btn.disabled = true; btn.textContent = 'Saving…'; }
  try {
    const { data, error } = await SB.client.rpc('admin_save_staff', {
      p_id:     id || '',
      p_name:   name,
      p_email:  email,
      p_role:   role,
      p_pin:    pin,
      p_active: active
    });
    if(error){ toast('Failed: '+(error.message||''),'error'); return; }
    if(data && data.ok === false){ toast(data.msg || 'Failed to save staff.','error'); return; }
    // Refresh staff list from Supabase so the new/changed row shows up
    await DB.refresh('users');
    DB.audit(id?'USER_SAVE':'USER_CREATE', Auth.current().id, Auth.current().role, { user_id:id||data.id, role });
    closeModal();
    toast(data.msg || 'Saved.','success');
    Views.adminUsers();
  } catch(e){
    toast('Error: '+(e.message||''),'error');
  } finally {
    if(btn){ btn.disabled = false; btn.textContent = 'Save'; }
  }
};

  const name = document.getElementById('s_name').value.trim();
  const adm = document.getElementById('s_adm').value.trim();
  const class_id = document.getElementById('s_cls').value;
  const pin = document.getElementById('s_pin').value.trim();
  const active = document.getElementById('s_act').checked;
  const parent_name = document.getElementById('s_pn').value.trim();
  const parent_phone = document.getElementById('s_pp').value.trim();
  if(!name||!adm){ toast('Name and admission number are required.','warn'); return; }
  if(!class_id){ toast('Class is required.','warn'); return; }

  const btn = document.querySelector('.modal .btn-primary');
  if(btn){ btn.disabled = true; btn.textContent = 'Saving…'; }
  try {
    const { data, error } = await SB.client.rpc('admin_save_student', {
      p_id:               id || '',
      p_name:             name,
      p_admission_number: adm,
      p_class_id:         class_id,
      p_pin:              pin,
      p_active:           active,
      p_parent_name:      parent_name,
      p_parent_phone:     parent_phone
    });
    if(error){ toast('Failed: '+(error.message||''),'error'); return; }
    if(data && data.ok === false){ toast(data.msg || 'Failed to save student.','error'); return; }
    await DB.refresh('students');
    DB.audit('STUDENT_SAVE', Auth.current().id, Auth.current().role, { student_id:id||data.id });
    closeModal(); toast(data.msg || 'Saved.','success'); Views.adminStudents();
  } catch(e){
    toast('Error: '+(e.message||''),'error');
  } finally {
    if(btn){ btn.disabled = false; btn.textContent = 'Save'; }
  }
};
Views._studentResetPin = async (id)=>{
  const newPin = String(Math.floor(1000 + Math.random()*9000));
  const s = DB.find('students', id);
  if(!s){ toast('Student not found.','error'); return; }
  // Call admin_save_student with all existing fields + new PIN
  const { data, error } = await SB.client.rpc('admin_save_student', {
    p_id:               id,
    p_name:             s.name,
    p_admission_number: s.admission_number,
    p_class_id:         s.class_id,
    p_pin:              newPin,
    p_active:           s.active,
    p_parent_name:      s.parent_name,
    p_parent_phone:     s.parent_phone
  });
  if(error){ toast('Failed: '+(error.message||''),'error'); return; }
  if(data && data.ok === false){ toast(data.msg || 'Failed.','error'); return; }
  await DB.refresh('students');
  DB.audit('STUDENT_PIN_RESET', Auth.current().id, Auth.current().role, { student_id:id });
  openModal('PIN reset', `<p>New PIN for this student:</p><div class="t-center" style="font-size:2rem;font-weight:800;color:var(--green-800);letter-spacing:.2rem">${newPin}</div><p class="t-small t-muted">The PIN is not used for student sign-in (students sign in by name only), but it is kept on record in case the school decides to require it later.</p><button class="btn btn-primary btn-block mt2" onclick="closeModal()">Done</button>`);
};

/* ============================================================
   10. APP INIT — async boot
   ------------------------------------------------------------
   Flow:
     1. Show loading splash.
     2. Try DB.init() (connects to Supabase).
     3. If Supabase connected and fetched OK → restore any
        existing auth session, then start the router.
     4. If Supabase configured but fetch failed → show setup
        screen with the error.
     5. If Supabase not configured at all → show setup screen
        with configuration instructions.
   ============================================================ */
async function boot(){
  // Loading splash
  document.getElementById('app').innerHTML = `
    <div class="splash">
      <div class="logo">KE</div>
      <h1>${escapeHtml(APP.schoolName)}</h1>
      <div class="spinner" style="border-color:rgba(255,255,255,.3);border-top-color:#fff;margin:0 auto 1rem"></div>
      <p>Connecting to Supabase…</p>
    </div>`;

  const result = await DB.init();

  if(result.ok && result.mode==='supabase'){
    // Restore any existing app-level session (from sessionStorage)
    await Auth.restoreSession();
    // Stale attempt cleanup: auto-submit any IN_PROGRESS whose deadline passed
    // (in production a Supabase cron + exam_auto_submit_expired RPC does this)
    DB.all('attempts').forEach(a=>{
      if(a.status==='IN_PROGRESS' && a.deadline_at && new Date(a.deadline_at).getTime() < Date.now()){
        Exam.autoSubmit(a.id, 'TIME_EXPIRED');
      }
    });
    Router.init();
  } else if(result.mode==='supabase' && !result.ok){
    // Configured but fetch failed
    Views.setup(result.error || 'Could not fetch data from Supabase. Check that the migrations have been applied and RLS policies allow your anon key to read.');
  } else {
    // Not configured at all
    Views.setup();
  }
}

boot();
