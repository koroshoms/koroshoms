<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
<meta name="theme-color" content="#0b6b3a" />
<meta name="description" content="Online Examination Management System for English-medium primary schools in Tanzania" />
<title>Korosho Exam Portal</title>
<style>
/* ============================================================
   Korosho English Medium Pre & Primary School — Examination Portal
   Single-file SPA for English-medium primary schools in Tanzania
   Frontend: HTML5 + CSS3 + vanilla JavaScript
   Backend: Supabase (PostgreSQL + Auth + RLS + Edge Functions)
   ============================================================ */

/* ---------- Design tokens ---------- */
:root{
  --green-900:#06351c; --green-800:#0b6b3a; --green-700:#0e7a44;
  --green-600:#129a55; --green-50:#e7f6ee;
  --yellow-700:#b5860b; --yellow-500:#f2c14e; --yellow-50:#fff8e6;
  --blue-700:#1d4ed8; --blue-50:#eef2ff;
  --red-700:#b91c1c; --red-50:#fee2e2;
  --ink-900:#0f172a; --ink-700:#334155; --ink-500:#64748b;
  --ink-300:#cbd5e1; --ink-200:#e2e8f0; --ink-100:#f1f5f9; --ink-50:#f8fafc;
  --white:#ffffff;
  --radius-sm:6px; --radius:10px; --radius-lg:16px;
  --shadow-sm:0 1px 2px rgba(15,23,42,.06);
  --shadow:0 4px 12px rgba(15,23,42,.10);
  --shadow-lg:0 12px 30px rgba(15,23,42,.18);
  --space:1rem;
  --font:"Segoe UI",Roboto,-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  --mono:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:var(--font); color:var(--ink-900); background:var(--ink-50);
  font-size:16px; line-height:1.5; -webkit-text-size-adjust:100%;
}
img{max-width:100%; display:block}
button{font-family:inherit; cursor:pointer}
input,select,textarea{font-family:inherit; font-size:16px}
a{color:var(--green-700); text-decoration:none}
a:hover{text-decoration:underline}

/* ---------- Layout ---------- */
.app-shell{min-height:100vh; display:flex; flex-direction:column}
.topbar{
  background:linear-gradient(135deg,var(--green-800),var(--green-600));
  color:#fff; padding:.6rem 1rem; display:flex; align-items:center;
  gap:.8rem; box-shadow:var(--shadow); position:sticky; top:0; z-index:50;
}
.topbar .brand{display:flex; align-items:center; gap:.5rem; font-weight:700; font-size:1.05rem}
.topbar .brand .logo{
  width:34px; height:34px; border-radius:8px; background:#fff;
  display:flex; align-items:center; justify-content:center;
  color:var(--green-800); font-weight:800; font-size:.95rem;
}
.topbar .spacer{flex:1}
.topbar .me{display:flex; align-items:center; gap:.5rem; font-size:.9rem}
.topbar .me .avatar{
  width:32px;height:32px;border-radius:50%; background:rgba(255,255,255,.25);
  display:flex;align-items:center;justify-content:center;font-weight:700;
}
.topbar .btn-ghost{
  background:rgba(255,255,255,.15); color:#fff; border:none;
  padding:.4rem .7rem; border-radius:var(--radius-sm); font-size:.85rem;
}
.topbar .btn-ghost:hover{background:rgba(255,255,255,.28)}

.container{max-width:1180px; margin:0 auto; padding:1rem; width:100%}
.page{padding:1rem}
.page-narrow{max-width:560px; margin:0 auto}

.row{display:flex; gap:.8rem; flex-wrap:wrap}
.col{flex:1; min-width:0}
.grid{display:grid; gap:.8rem}
.grid-2{grid-template-columns:repeat(2,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-4{grid-template-columns:repeat(4,1fr)}
@media(max-width:760px){
  .grid-2,.grid-3,.grid-4{grid-template-columns:1fr}
  .hide-sm{display:none}
}

/* ---------- Cards ---------- */
.card{
  background:#fff; border:1px solid var(--ink-200); border-radius:var(--radius);
  padding:1rem; box-shadow:var(--shadow-sm);
}
.card.hover:hover{box-shadow:var(--shadow); border-color:var(--ink-300)}
.card h3{margin:0 0 .5rem; font-size:1.05rem}
.card .sub{color:var(--ink-500); font-size:.85rem}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:.4rem;
  border:1px solid transparent; border-radius:var(--radius-sm);
  padding:.55rem .9rem; font-size:.95rem; font-weight:600;
  background:var(--ink-100); color:var(--ink-900); transition:.15s;
  min-height:42px;
}
.btn:hover{filter:brightness(.97)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5; cursor:not-allowed}
.btn-primary{background:var(--green-700); color:#fff}
.btn-danger{background:var(--red-700); color:#fff}
.btn-warn{background:var(--yellow-700); color:#fff}
.btn-blue{background:var(--blue-700); color:#fff}
.btn-ghost{background:transparent; border-color:var(--ink-300); color:var(--ink-700)}
.btn-sm{padding:.3rem .6rem; min-height:32px; font-size:.85rem}
.btn-block{display:flex; width:100%}
.btn-icon{padding:.4rem; min-height:36px; min-width:36px}

/* ---------- Forms ---------- */
.field{margin-bottom:.9rem}
.field label{display:block; font-weight:600; font-size:.9rem; margin-bottom:.3rem}
.field .hint{color:var(--ink-500); font-size:.8rem; margin-top:.25rem}
.field .err{color:var(--red-700); font-size:.8rem; margin-top:.25rem}
.input,select,textarea{
  width:100%; padding:.6rem .7rem; border:1px solid var(--ink-300);
  border-radius:var(--radius-sm); background:#fff; color:var(--ink-900);
  min-height:42px;
}
.input:focus,select:focus,textarea:focus{
  outline:2px solid var(--green-600); outline-offset:-1px; border-color:var(--green-600);
}
textarea{min-height:90px; resize:vertical}
.input.error{border-color:var(--red-700)}
label.check{display:flex; align-items:center; gap:.5rem; font-weight:400; cursor:pointer}
label.check input{width:auto; min-height:auto}

/* ---------- Badges ---------- */
.badge{
  display:inline-flex; align-items:center; gap:.3rem; padding:.15rem .55rem;
  border-radius:999px; font-size:.72rem; font-weight:700; letter-spacing:.02em;
}
.badge-green{background:var(--green-50); color:var(--green-800)}
.badge-yellow{background:var(--yellow-50); color:var(--yellow-700)}
.badge-blue{background:var(--blue-50); color:var(--blue-700)}
.badge-red{background:var(--red-50); color:var(--red-700)}
.badge-gray{background:var(--ink-100); color:var(--ink-700)}

/* ---------- Tables ---------- */
.table{width:100%; border-collapse:collapse; font-size:.9rem}
.table th,.table td{padding:.55rem .6rem; text-align:left; border-bottom:1px solid var(--ink-200); vertical-align:top}
.table th{background:var(--ink-50); font-weight:700; color:var(--ink-700); font-size:.8rem; text-transform:uppercase; letter-spacing:.03em}
.table tr:hover td{background:var(--ink-50)}
.table-wrap{overflow-x:auto; border:1px solid var(--ink-200); border-radius:var(--radius)}

/* ---------- Alerts ---------- */
.alert{padding:.7rem .9rem; border-radius:var(--radius-sm); margin-bottom:.8rem; font-size:.9rem; border:1px solid transparent}
.alert-info{background:var(--blue-50); color:var(--blue-700); border-color:#cdd9ff}
.alert-warn{background:var(--yellow-50); color:var(--yellow-700); border-color:#fde9b0}
.alert-error{background:var(--red-50); color:var(--red-700); border-color:#fbcaca}
.alert-success{background:var(--green-50); color:var(--green-800); border-color:#bce5cc}

/* ---------- Modal ---------- */
.modal-backdrop{
  position:fixed; inset:0; background:rgba(15,23,42,.55); z-index:100;
  display:flex; align-items:flex-start; justify-content:center; padding:1rem;
  overflow-y:auto;
}
.modal{
  background:#fff; border-radius:var(--radius-lg); max-width:680px; width:100%;
  margin:1rem auto; box-shadow:var(--shadow-lg); animation:pop .15s ease-out;
}
.modal.lg{max-width:920px}
.modal.xl{max-width:1180px}
@keyframes pop{from{transform:translateY(8px); opacity:0}to{transform:none; opacity:1}}
.modal-head{padding:1rem 1.2rem; border-bottom:1px solid var(--ink-200); display:flex; align-items:center; justify-content:space-between}
.modal-head h3{margin:0; font-size:1.1rem}
.modal-body{padding:1.2rem; max-height:70vh; overflow-y:auto}
.modal-foot{padding:.8rem 1.2rem; border-top:1px solid var(--ink-200); display:flex; gap:.5rem; justify-content:flex-end; background:var(--ink-50); border-radius:0 0 var(--radius-lg) var(--radius-lg)}

/* ---------- Tabs ---------- */
.tabs{display:flex; gap:.3rem; border-bottom:2px solid var(--ink-200); margin-bottom:1rem; overflow-x:auto}
.tab{padding:.5rem .9rem; cursor:pointer; color:var(--ink-500); font-weight:600; font-size:.9rem; border-bottom:2px solid transparent; margin-bottom:-2px; white-space:nowrap}
.tab.active{color:var(--green-700); border-color:var(--green-700)}
.tab:hover{color:var(--ink-900)}

/* ---------- Exam-specific ---------- */
.exam-topbar{
  position:sticky; top:0; z-index:40; background:#fff; border-bottom:1px solid var(--ink-200);
  padding:.5rem 1rem; display:flex; align-items:center; gap:.8rem; box-shadow:var(--shadow-sm);
}
.timer{
  font-family:var(--mono); font-weight:700; font-size:1.15rem; padding:.35rem .8rem;
  border-radius:var(--radius-sm); background:var(--green-50); color:var(--green-800);
  border:1px solid var(--green-600);
}
.timer.warn{background:var(--yellow-50); color:var(--yellow-700); border-color:var(--yellow-500)}
.timer.danger{background:var(--red-50); color:var(--red-700); border-color:var(--red-700); animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}

.q-nav{display:flex; flex-wrap:wrap; gap:.35rem}
.q-pill{
  width:38px; height:38px; border-radius:8px; border:1px solid var(--ink-300);
  display:flex; align-items:center; justify-content:center; font-weight:700;
  font-size:.85rem; background:#fff; color:var(--ink-700); cursor:pointer;
}
.q-pill.answered{background:var(--green-700); color:#fff; border-color:var(--green-700)}
.q-pill.flagged{background:var(--yellow-500); color:var(--ink-900); border-color:var(--yellow-700)}
.q-pill.current{outline:3px solid var(--blue-700); outline-offset:1px}

.passage{
  background:var(--ink-50); border-left:4px solid var(--green-700); padding:.8rem 1rem;
  border-radius:0 var(--radius-sm) var(--radius-sm) 0; margin-bottom:1rem; font-size:.95rem;
  max-height:280px; overflow-y:auto;
}
.passage h4{margin:0 0 .5rem; color:var(--green-800)}
.passage p{margin:0 0 .5rem}

.option-row{
  display:flex; align-items:flex-start; gap:.6rem; padding:.7rem .8rem; border:1px solid var(--ink-200);
  border-radius:var(--radius-sm); margin-bottom:.5rem; cursor:pointer; background:#fff;
}
.option-row:hover{background:var(--ink-50)}
.option-row.selected{border-color:var(--green-700); background:var(--green-50)}
.option-row input{margin-top:.2rem}

.match-row{display:grid; grid-template-columns:1fr 1fr; gap:.5rem; margin-bottom:.5rem}
.match-row select{min-height:42px}

.stat{display:flex; flex-direction:column; gap:.15rem}
.stat .v{font-size:1.6rem; font-weight:800; color:var(--green-800)}
.stat .l{font-size:.78rem; color:var(--ink-500); text-transform:uppercase; letter-spacing:.04em}

.empty{text-align:center; padding:2.5rem 1rem; color:var(--ink-500)}
.empty .ico{font-size:2.5rem; opacity:.4; margin-bottom:.5rem}

/* ---------- Toast ---------- */
.toast-wrap{position:fixed; bottom:1rem; right:1rem; z-index:200; display:flex; flex-direction:column; gap:.5rem}
.toast{
  background:var(--ink-900); color:#fff; padding:.7rem 1rem; border-radius:var(--radius-sm);
  box-shadow:var(--shadow-lg); font-size:.9rem; max-width:340px; animation:slidein .2s;
}
.toast.success{background:var(--green-700)}
.toast.error{background:var(--red-700)}
.toast.warn{background:var(--yellow-700)}
@keyframes slidein{from{transform:translateX(20px); opacity:0}to{transform:none; opacity:1}}

/* ---------- Print ---------- */
@media print{
  .topbar,.exam-topbar,.no-print{display:none}
  body{background:#fff}
  .card{box-shadow:none; border-color:#ddd}
}

/* ---------- Utility ---------- */
.mt0{margin-top:0} .mt1{margin-top:.5rem} .mt2{margin-top:1rem} .mt3{margin-top:1.5rem}
.mb0{margin-bottom:0} .mb1{margin-bottom:.5rem} .mb2{margin-bottom:1rem} .mb3{margin-bottom:1.5rem}
.t-right{text-align:right} .t-center{text-align:center} .t-muted{color:var(--ink-500)}
.t-small{font-size:.82rem} .t-tiny{font-size:.72rem} .t-bold{font-weight:700}
.t-green{color:var(--green-700)} .t-red{color:var(--red-700)} .t-yellow{color:var(--yellow-700)}
.flex{display:flex} .flex-between{display:flex; justify-content:space-between; align-items:center}
.gap1{gap:.5rem} .gap2{gap:1rem}
.hidden{display:none}
.divider{height:1px; background:var(--ink-200); margin:1rem 0}
.spinner{
  width:24px; height:24px; border:3px solid var(--ink-200); border-top-color:var(--green-700);
  border-radius:50%; animation:spin 1s linear infinite; display:inline-block;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* Splash */
.splash{
  min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:linear-gradient(135deg,var(--green-800),var(--green-600)); color:#fff; text-align:center; padding:2rem;
}
.splash .logo{
  width:80px; height:80px; border-radius:18px; background:#fff; color:var(--green-800);
  display:flex; align-items:center; justify-content:center; font-weight:800; font-size:2rem; margin-bottom:1rem;
  box-shadow:var(--shadow-lg);
}
.splash h1{margin:0 0 .3rem; font-size:1.8rem}
.splash p{opacity:.9; margin:0 0 1.5rem; max-width:480px}
</style>
</head>
<body>
<div id="app" class="app-shell"></div>
<div id="modal-root"></div>
<div id="toast-root" class="toast-wrap"></div>

<!-- Supabase JS client (loaded before the app script) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ============================================================
   JAVASCRIPT — single-file SPA (Supabase-connected)
   Korosho English Medium Pre & Primary School
   P.O. Box 03, Tandahimba, Tanzania
   Motto: "Where the knowledge lights"
   ============================================================
   Sections:
     1. Constants & config (Supabase URL + anon key)
     2. DB layer (Supabase REST with in-memory cache)
     3. Utilities (toast, modal, format, id)
     4. Auth service (Supabase Auth for staff; RPC for students)
     5. Timer service (server-authoritative)
     6. Router
     7. Question renderers (8 types)
     8. Views (login, student, teacher, admin, marking, reports)
     9. App init (async boot, setup screen)
   ============================================================ */
'use strict';

/* ============================================================
   1. CONSTANTS & CONFIG
   ============================================================ */
// *** SUPABASE CONFIGURATION ***
// Fill in these two values from your Supabase project:
//   Dashboard → Project Settings → API → Project URL + anon public key
const CONFIG = {
  supabaseUrl: 'https://nqcywxxhsjbrsvosdpdz.supabase.co',
  supabaseAnonKey: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5xY3l3eHhoc2picnN2b3NkcGR6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ1MjYxMTYsImV4cCI6MjExMDEwMjExNn0.AhdVXim0-WTMiC0lAkRRIvJd-pNNuA4_clE29uuwmtc'
};

// Maps in-app collection names to actual Supabase table names.
// All exam-module tables are prefixed with exam_ and are created
// by migrations.sql. Adjust the right-hand side if your project
// uses different names.
const TABLE_MAP = {
  classes:              'exam_classes',
  subjects:             'exam_subjects',
  users:                'exam_staff_list',      // view (PIN hidden) — see group 11
  students:             'exam_students_list',   // view (PIN hidden) — see group 11
  teacher_assignments:  'exam_teacher_assignments',
  exams:                'exam_exams',
  questions:            'exam_questions',
  attempts:             'exam_attempts',
  answers:              'exam_answers',
  publications:         'exam_publications',
  audit_logs:           'exam_audit_logs',
  settings:             'exam_settings'
};

const APP = {
  name: 'Korosho Exam Portal',
  version: '2.0.0',
  schoolName: 'KOROSHO ENGLISH MEDIUM PRE & PRIMARY SCHOOL',
  schoolMotto: 'Where the knowledge lights',
  schoolAddress: 'P.O. Box 03, Tandahimba, Tanzania',
  schoolEmail: 'koroshoschool@gmail.com',
  schoolPhones: ['+255 623 638 683', '+255 622 014 158', '+255 613 367 354'],
  country: 'Tanzania',
  levels: ['PRE-UNIT','STANDARD ONE','STANDARD TWO','STANDARD THREE','STANDARD FOUR','STANDARD FIVE','STANDARD SIX','STANDARD SEVEN'],
  levelShort: { 'PRE-UNIT':'PRE-UNIT','STANDARD ONE':'STD 1','STANDARD TWO':'STD 2','STANDARD THREE':'STD 3','STANDARD FOUR':'STD 4','STANDARD FIVE':'STD 5','STANDARD SIX':'STD 6','STANDARD SEVEN':'STD 7' },
  subjects: ['English Language','Kiswahili','Mathematics','Science and Technology','Social Studies','Civics and Moral Education','Geography','History','Religious Education','Vocational Skills'],
  categories: ['Weekly Test','Topic Test','Monthly Test','Midterm Examination','Terminal Examination','Annual Examination','Revision Exercise','Mock Examination','Special Assessment'],
  timingPolicies: [
    { id:'ELAPSED', label:'Elapsed-Time (timer runs even if browser closed) — DEFAULT' },
    { id:'ACTIVE_SESSION', label:'Active-Session (timer pauses on interruption, server-controlled)' }
  ],
  terms: ['Term 1','Term 2','Term 3']
};

const Q_TYPES = {
  MCQ:        { label:'Multiple Choice',  autoMarkable:true  },
  TRUE_FALSE: { label:'True / False',     autoMarkable:true  },
  FILL:       { label:'Fill in the Blank',autoMarkable:true  },
  SHORT:      { label:'Short Answer',     autoMarkable:'optional' },
  MATCHING:   { label:'Matching',         autoMarkable:true  },
  READING:    { label:'Reading Comprehension', autoMarkable:'mixed' },
  WRITING:    { label:'Writing / Composition', autoMarkable:false },
  PICTURE:    { label:'Picture-Based',    autoMarkable:'optional' }
};

const EXAM_STATUS = {
  DRAFT:'Draft', SCHEDULED:'Scheduled', PUBLISHED:'Published',
  LIVE:'Live', CLOSED:'Closed', ARCHIVED:'Archived'
};
const ATTEMPT_STATUS = {
  IN_PROGRESS:'In Progress', SUBMITTED:'Submitted',
  AWAITING_MARKING:'Awaiting Marking', MARKED:'Marked',
  APPROVED:'Approved', PUBLISHED:'Published', REJECTED:'Rejected'
};

/* ============================================================
   2. DB LAYER — Supabase-connected
   ------------------------------------------------------------
   On boot, fetches all tables from Supabase into an in-memory
   cache. Reads are synchronous from the cache. Writes are
   optimistic (cache updated immediately) then synced to Supabase
   in the background. If a sync fails, a toast is shown.
   ============================================================ */
const SB = {
  client: null,
  create(){
    if(!CONFIG.supabaseUrl || !CONFIG.supabaseAnonKey) return null;
    if(!this.client){
      this.client = supabase.createClient(CONFIG.supabaseUrl, CONFIG.supabaseAnonKey, {
        auth: { persistSession: true, autoRefreshToken: true }
      });
    }
    return this.client;
  }
};

const DB = {
  mode: null,              // always 'supabase' after init
  _client: null,
  _data: null,

  // ---------- Boot ----------
  async init(){
    this._client = SB.create();
    if(this._client){
      this.mode = 'supabase';
      this._data = this._emptyData();
      try {
        await this._fetchFromSupabase();
        return { ok:true, mode:'supabase' };
      } catch(e){
        console.error('Supabase fetch failed:', e);
        return { ok:false, mode:'supabase', error: e.message||'fetch failed' };
      }
    }
    // No Supabase config — show setup screen
    return { ok:false, mode:'none' };
  },

  _emptyData(){
    return {
      classes:[], subjects:[], users:[], students:[], teacher_assignments:[],
      exams:[], questions:[], attempts:[], answers:[], audit_logs:[], publications:[],
      settings:{ school_name: APP.schoolName, academic_year:'2026', default_timing_policy:'ELAPSED', allow_parent_portal:false, session_timeout_minutes:60 }
    };
  },

  async _fetchFromSupabase(){
    const c = this._client;
    // Fetch all tables in parallel
    const fetchTable = async (cacheName) => {
      const tableName = TABLE_MAP[cacheName];
      const { data, error } = await c.from(tableName).select('*');
      if(error){ console.warn(`fetch ${tableName}:`, error.message); return; }
      this._data[cacheName] = data || [];
    };
    await Promise.all(['classes','subjects','users','students','teacher_assignments',
                       'exams','questions','attempts','answers','audit_logs','publications'].map(fetchTable));
    // settings (single row)
    const { data:s, error:se } = await c.from(TABLE_MAP.settings).select('*').limit(1).maybeSingle();
    if(!se && s) this._data.settings = s;
  },

  // ---------- Reads (synchronous, from in-memory cache) ----------
  raw(){ return this._data; },
  t(name){ if(!this._data) return []; if(!this._data[name]) this._data[name]=[]; return this._data[name]; },
  all(name){ return this.t(name).slice(); },
  find(name, id){ return this.t(name).find(r=>r.id===id); },
  findWhere(name, pred){ return this.t(name).filter(pred); },
  firstWhere(name, pred){ return this.t(name).find(pred); },

  // ---------- Writes (optimistic cache + background Supabase sync) ----------
  insert(name, row){
    row.id = row.id || crypto.randomUUID();
    row.created_at = row.created_at || nowISO();
    row.updated_at = nowISO();
    this.t(name).push(row);
    this._syncInsert(name, row);
    return row;
  },
  // Cache-only variants: update the in-memory cache WITHOUT syncing
  // to Supabase. Used when persistence goes through an RPC instead
  // of a direct table write (e.g. student answer saving).
  insertCacheOnly(name, row){
    row.id = row.id || crypto.randomUUID();
    row.created_at = row.created_at || nowISO();
    row.updated_at = nowISO();
    this.t(name).push(row);
    return row;
  },
  updateCacheOnly(name, id, patch){
    const r = this.find(name, id);
    if(!r) return null;
    Object.assign(r, patch, { updated_at: nowISO() });
    return r;
  },
  update(name, id, patch){
    const r = this.find(name, id);
    if(!r) return null;
    Object.assign(r, patch, { updated_at: nowISO() });
    this._syncUpdate(name, id, r);
    return r;
  },
  remove(name, id){
    const arr = this.t(name);
    const i = arr.findIndex(r=>r.id===id);
    if(i<0) return false;
    arr.splice(i,1);
    this._syncRemove(name, id);
    return true;
  },
  // Full re-sync of a table from Supabase (used after bulk operations)
  async refresh(name){
    if(this.mode!=='supabase') return;
    const tableName = TABLE_MAP[name];
    if(!tableName) return;
    const { data, error } = await this._client.from(tableName).select('*');
    if(!error) this._data[name] = data || [];
  },

  // ---------- Background sync to Supabase (fire-and-forget) ----------
  async _syncInsert(name, row){
    if(!this._client) return;
    // answers and attempts go through RPCs (save_student_answer,
    // exam_start_attempt) — skip direct insert (RLS blocks it)
    if(name==='answers' || name==='attempts') return;
    const tableName = TABLE_MAP[name];
    const payload = this._sanitize(row, name);
    const { data, error } = await this._client.from(tableName).insert(payload).select();
    if(error){
      console.error(`Sync insert to ${tableName} failed:`, error);
      toast(`Save failed: ${error.message||'check console'}`, 'error');
      return;
    }
    // Update cache with server-generated id/defaults
    if(data && data[0]){
      const cached = this.find(name, row.id);
      if(cached) Object.assign(cached, data[0]);
    }
  },
  async _syncUpdate(name, id, row){
    if(!this._client) return;
    const tableName = TABLE_MAP[name];
    const payload = this._sanitize(row, name);
    const { error } = await this._client.from(tableName).update(payload).eq('id', id);
    if(error){
      console.error(`Sync update to ${tableName} failed:`, error);
      toast(`Update failed: ${error.message||'check console'}`, 'error');
    }
  },
  async _syncRemove(name, id){
    if(!this._client) return;
    const tableName = TABLE_MAP[name];
    const { error } = await this._client.from(tableName).delete().eq('id', id);
    if(error) console.error(`Sync delete from ${tableName} failed:`, error);
  },
  // Strip fields that shouldn't be sent to Supabase (client-only)
  _sanitize(row, name){
    const p = Object.assign({}, row);
    // For exam tables with uuid PKs, don't send the client-generated UUID;
    // let Postgres generate it.
    if(this._isUuidTable(name)) delete p.id;
    return p;
  },
  _isUuidTable(name){
    // All exam_* tables use uuid primary keys
    return ['classes','subjects','users','students','teacher_assignments',
            'exams','questions','attempts','answers','publications','audit_logs'].includes(name);
  },

  // ---------- Reset (admin action: re-fetch from Supabase) ----------
  async reset(){
    this._data = this._emptyData();
    await this._fetchFromSupabase();
  },

  // ---------- Audit ----------
  audit(action, actor_id, actor_role, details){
    this.insert('audit_logs', { action, actor_id: String(actor_id), actor_role, details: details||{}, at: nowISO() });
  }
};

/* ============================================================
   3. UTILITIES
   ============================================================ */
function uid(prefix='id'){
  return prefix+'_'+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
}
function nowISO(){ return new Date().toISOString(); }
function fmtDate(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleString('en-GB',{ year:'numeric',month:'short',day:'2-digit',hour:'2-digit',minute:'2-digit' });
}
function fmtDateShort(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString('en-GB',{ year:'numeric',month:'short',day:'2-digit' });
}
function escapeHtml(s){
  if(s===null||s===undefined) return '';
  return String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function clsName(id){ const c=DB.find('classes',id); return c?c.level:'—'; }
function initials(name){ return (name||'?').split(' ').slice(0,2).map(w=>w[0]||'').join('').toUpperCase(); }

// Toast
function toast(msg, type='info'){
  const wrap = document.getElementById('toast-root');
  const el = document.createElement('div');
  el.className = 'toast '+type;
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transform='translateX(20px)'; setTimeout(()=>el.remove(),200); }, 3200);
}

// Modal
function openModal(title, bodyHtml, opts={}){
  const root = document.getElementById('modal-root');
  const sizeClass = opts.size||'';
  root.innerHTML = `
    <div class="modal-backdrop" onclick="if(event.target===this)closeModal()">
      <div class="modal ${sizeClass}">
        <div class="modal-head">
          <h3>${escapeHtml(title)}</h3>
          <button class="btn btn-ghost btn-sm" onclick="closeModal()">✕</button>
        </div>
        <div class="modal-body">${bodyHtml}</div>
        ${opts.footer?`<div class="modal-foot">${opts.footer}</div>`:''}
      </div>
    </div>`;
}
function closeModal(){ document.getElementById('modal-root').innerHTML=''; }
function confirmDialog(msg, onYes, opts={}){
  openModal(opts.title||'Please confirm', `<p>${escapeHtml(msg)}</p>`, {
    footer:`<button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
            <button class="btn ${opts.danger?'btn-danger':'btn-primary'}" id="confirm-yes">Yes, continue</button>`
  });
  document.getElementById('confirm-yes').onclick = ()=>{ closeModal(); onYes(); };
}

/* ============================================================
   5. AUTH SERVICE
   ------------------------------------------------------------
   App-level auth (no Supabase Auth):
     - Staff: email + PIN. The PIN is verified server-side by the
       staff_login RPC, so no PINs are ever sent back to the browser.
     - Students: class + exact name. Verified server-side by the
       student_login RPC. No PIN, no password.
   Session is cached in sessionStorage so the router can read it
   synchronously via Auth.current().
   ============================================================ */
const Auth = {
  _sessionKey:'tanzed_exam_session_v1',
  current(){ try{ return JSON.parse(sessionStorage.getItem(this._sessionKey)); }catch(e){ return null; } },
  _setSession(sess){ sessionStorage.setItem(this._sessionKey, JSON.stringify(sess)); return sess; },

  async logout(){
    const s = this.current();
    if(s) DB.audit('LOGOUT', s.id, s.role, {});
    sessionStorage.removeItem(this._sessionKey);
    location.hash = '#/';
  },

  // Rate limiting (client-side; in production also enforce server-side)
  _attempts:{},
  checkRateLimit(key){
    const rec = this._attempts[key] || { count:0, firstAt:Date.now() };
    if(Date.now() - rec.firstAt > 5*60*1000){ rec.count=0; rec.firstAt=Date.now(); }
    rec.count++;
    this._attempts[key] = rec;
    if(rec.count > 5){
      const wait = Math.ceil((5*60*1000 - (Date.now()-rec.firstAt))/1000);
      return { ok:false, msg:`Too many attempts. Try again in ${wait} seconds.` };
    }
    return { ok:true };
  },

  // ---------- Staff login (email + PIN, verified server-side) ----------
  async staffLogin(email, pin){
    email = (email||'').trim().toLowerCase();
    const rl = this.checkRateLimit('staff_'+email);
    if(!rl.ok) return { ok:false, msg:rl.msg };

    const { data, error } = await SB.client.rpc('staff_login', {
      p_email: email, p_pin: pin
    });
    if(error) return { ok:false, msg:'Sign-in failed: '+(error.message||'') };
    if(!data || data.ok === false){
      return { ok:false, msg: (data && data.msg) || 'Incorrect email or PIN.' };
    }
    delete this._attempts['staff_'+email];
    const sess = this._setSession({
      id:    data.id,
      role:  data.role,
      name:  data.name,
      email: data.email,
      login_at: nowISO()
    });
    DB.audit('STAFF_LOGIN', data.id, data.role, {});
    return { ok:true, session:sess };
  },

  // ---------- Student login (class + exact name, no PIN) ----------
  async studentLogin(classId, name){
    const rl = this.checkRateLimit('stu_'+classId+'_'+(name||'').toLowerCase());
    if(!rl.ok) return { ok:false, msg:rl.msg };

    const { data, error } = await SB.client.rpc('student_login', {
      p_class_id: classId, p_name: name
    });
    if(error) return { ok:false, msg:'Sign-in failed: '+(error.message||'') };
    if(!data || data.ok === false){
      return { ok:false, msg: (data && data.msg) || 'No matching student found.' };
    }
    delete this._attempts['stu_'+classId+'_'+(name||'').toLowerCase()];
    const sess = this._setSession({
      id:                data.id,
      role:              'student',
      name:              data.name,
      admission_number:  data.admission_number,
      class_id:          data.class_id,
      login_at:          nowISO()
    });
    DB.audit('STUDENT_LOGIN', data.id, 'student', { class_id:data.class_id });
    return { ok:true, session:sess };
  },

  // On boot: restore any session we cached in sessionStorage.
  // (No Supabase Auth session to restore — the session IS the cache.)
  async restoreSession(){
    // If the cached session is for a student, the cache is still valid
    // (the student's row hasn't changed). For staff we also trust the
    // cache; if the staff was deactivated, the next protected action
    // will fail and they'll be logged out.
    return this.current();
  }
};

/* ============================================================
   6. TIMER SERVICE
   Server-authoritative simulation: deadline stored on attempt;
   frontend only DISPLAYS remaining time. Auto-submit enforced
   by deadline check on every save + a watchdog tick.
   In production, the deadline is set by a Supabase RPC at
   attempt start and checked server-side at submit.
   ============================================================ */
const Timer = {
  _tickHandle:null,
  _onExpire:null,
  start(attemptId, onTick, onExpire){
    this.stop();
    this._onExpire = onExpire;
    const tick = ()=>{
      const remaining = this.remaining(attemptId);
      onTick(remaining);
      if(remaining <= 0){
        this.stop();
        onExpire();
      }
    };
    tick();
    this._tickHandle = setInterval(tick, 1000);
  },
  stop(){ if(this._tickHandle){ clearInterval(this._tickHandle); this._tickHandle=null; } },
  remaining(attemptId){
    const a = DB.find('attempts', attemptId);
    if(!a) return 0;
    // Server-authoritative: deadline stored on attempt at start
    const deadline = new Date(a.deadline_at).getTime();
    return Math.max(0, Math.floor((deadline - Date.now())/1000));
  },
  fmt(sec){
    sec = Math.max(0, Math.floor(sec));
    const h = Math.floor(sec/3600);
    const m = Math.floor((sec%3600)/60);
    const s = sec%60;
    return (h>0?h+':'+String(m).padStart(2,'0'):String(m).padStart(2,'0'))+':'+String(s).padStart(2,'0');
  }
};

/* ============================================================
   7. ROUTER
   ============================================================ */
const Router = {
  init(){
    window.addEventListener('hashchange', ()=>this.dispatch());
    this.dispatch();
  },
  dispatch(){
    const hash = location.hash.replace(/^#/,'') || '/';
    const sess = Auth.current();
    const parts = hash.split('/').filter(Boolean); // ['student','exam',id]
    const root = parts[0] || '';

    // Public routes
    if(root==='' || root==='login'){ return Views.login(); }
    if(root==='student-login'){ return Views.studentLogin(); }
    if(root==='staff'){ return Views.staffLogin(); }

    // Protected
    if(!sess){ toast('Please sign in first.','warn'); return Views.login(); }

    if(sess.role==='student'){
      if(root==='dashboard') return Views.studentDashboard();
      if(root==='exam' && parts[1]==='start' && parts[2]) return Views.examStart(parts[2]);
      if(root==='exam' && parts[1]==='take' && parts[2]) return Views.examTake(parts[2]);
      if(root==='result' && parts[1]) return Views.studentResult(parts[1]);
      if(root==='history') return Views.studentHistory();
      return Views.studentDashboard();
    }
    if(sess.role==='teacher'){
      if(root==='teacher') return Views.teacherDashboard();
      if(root==='exams' && parts[1]==='new') return Views.examEditor(null);
      if(root==='exams' && parts[1]==='edit' && parts[2]) return Views.examEditor(parts[2]);
      if(root==='exams' && parts[1]==='preview' && parts[2]) return Views.examPreview(parts[2]);
      if(root==='marking' && parts[1]) return Views.marking(parts[1]);
      if(root==='approval') return Views.approvalQueue();
      if(root==='reports') return Views.teacherReports();
      return Views.teacherDashboard();
    }
    if(sess.role==='super_admin'){
      if(root==='admin' && parts[1]==='users') return Views.adminUsers();
      if(root==='admin' && parts[1]==='classes') return Views.adminClasses();
      if(root==='admin' && parts[1]==='subjects') return Views.adminSubjects();
      if(root==='admin' && parts[1]==='assignments') return Views.adminAssignments();
      if(root==='admin' && parts[1]==='students') return Views.adminStudents();
      if(root==='admin' && parts[1]==='audit') return Views.adminAudit();
      if(root==='admin' && parts[1]==='settings') return Views.adminSettings();
      if(root==='admin' && parts[1]==='reports') return Views.adminReports();
      if(root==='admin') return Views.adminDashboard();
      return Views.adminDashboard();
    }
    Views.notFound();
  }
};

/* ============================================================
   8. QUESTION RENDERERS
   Each returns HTML for display + binds events.
   Markers return { correct:bool, awarded:number, max:number, note:string }.
   ============================================================ */
const Q = {
  // Render prompt + media (passage/picture)
  renderMedia(q){
    let h = '';
    if(q.passage_text){
      h += `<div class="passage"><h4>${escapeHtml(q.passage_title||'Passage')}</h4>${q.passage_text.split('\n').map(p=>`<p>${escapeHtml(p)}</p>`).join('')}</div>`;
    }
    if(q.picture_emoji){
      h += `<div class="t-center mb2"><div style="font-size:5rem;line-height:1">${q.picture_emoji}</div><div class="t-muted t-small">${escapeHtml(q.picture_caption||'')}</div></div>`;
    }
    return h;
  },

  render(q, attemptId, savedAnswer){
    const aid = `ans_${q.id}`;
    let body = this.renderMedia(q) + `<div class="mb2 t-bold">${escapeHtml(q.prompt)}</div>`;
    let bind = ()=>{};

    switch(q.type){
      case 'MCQ': {
        const opts = q.options.map((o,i)=>`
          <label class="option-row" data-opt="${escapeHtml(o)}">
            <input type="radio" name="${aid}" value="${escapeHtml(o)}" ${savedAnswer===o?'checked':''}>
            <span>${escapeHtml(o)}</span>
          </label>`).join('');
        body += opts;
        bind = ()=>{ document.querySelectorAll(`[data-opt]`).forEach(el=>{
          el.addEventListener('click', ()=>{ const inp=el.querySelector('input'); inp.checked=true; el.classList.add('selected'); document.querySelectorAll(`[data-opt]`).forEach(x=>x!==el&&x.classList.remove('selected')); Exam.saveAnswer(q.id, inp.value); });
        });
        // restore selected
        const cur = document.querySelector(`input[name="${aid}"]:checked`);
        if(cur) cur.closest('.option-row').classList.add('selected');
        };
        break;
      }
      case 'TRUE_FALSE': {
        const opts = ['true','false'].map(v=>`
          <label class="option-row" data-tf="${v}">
            <input type="radio" name="${aid}" value="${v}" ${String(savedAnswer)===v?'checked':''}>
            <span>${v==='true'?'True':'False'}</span>
          </label>`).join('');
        body += opts;
        bind = ()=>{ document.querySelectorAll(`[data-tf]`).forEach(el=>{
          el.addEventListener('click', ()=>{ const inp=el.querySelector('input'); inp.checked=true; el.classList.add('selected'); document.querySelectorAll(`[data-tf]`).forEach(x=>x!==el&&x.classList.remove('selected')); Exam.saveAnswer(q.id, inp.value); });
        });
        const cur = document.querySelector(`input[name="${aid}"]:checked`);
        if(cur) cur.closest('.option-row').classList.add('selected');
        };
        break;
      }
      case 'FILL': {
        const blanks = q.blanks||1;
        const saved = Array.isArray(savedAnswer)? savedAnswer : (savedAnswer? [savedAnswer] : []);
        let inputs = '';
        for(let i=0;i<blanks;i++){
          inputs += `<input class="input mb1" data-blank="${i}" placeholder="Answer ${i+1}" value="${escapeHtml(saved[i]||'')}" oninput="Exam.saveAnswer('${q.id}', Exam.collectBlanks(this))">`;
        }
        body += inputs;
        break;
      }
      case 'SHORT': {
        const saved = Array.isArray(savedAnswer)? savedAnswer.join(', ') : (savedAnswer||'');
        body += `<textarea class="input" data-short placeholder="Write your answer here..." oninput="Exam.saveAnswer('${q.id}', this.value)">${escapeHtml(saved)}</textarea>`;
        if(q.accepted_answers) body += `<div class="hint">Accepted answers will be auto-marked if exact; otherwise your teacher will mark this.</div>`;
        if(q.rubric) body += `<div class="hint t-muted">Marking guide available to your teacher.</div>`;
        break;
      }
      case 'MATCHING': {
        const saved = savedAnswer||{};
        // Render pairs: left item + select dropdown of right items (shuffled)
        const rightOpts = [...q.right_items].sort(()=>Math.random()-0.5);
        body += q.left_items.map((l,i)=>`
          <div class="match-row">
            <div class="input" style="background:var(--ink-100); font-weight:600">${escapeHtml(l)}</div>
            <select class="input" data-match="${escapeHtml(l)}" onchange="Exam.saveAnswer('${q.id}', Exam.collectMatches())">
              <option value="">— choose match —</option>
              ${rightOpts.map(r=>`<option value="${escapeHtml(r)}" ${saved[l]===r?'selected':''}>${escapeHtml(r)}</option>`).join('')}
            </select>
          </div>`).join('');
        bind = ()=>{ /* onchange handles */ };
        break;
      }
      case 'WRITING': {
        const saved = Array.isArray(savedAnswer)? savedAnswer.join('\n') : (savedAnswer||'');
        const wordCountId = `wc_${q.id}`;
        body += `<textarea class="input" data-write style="min-height:220px" placeholder="Write your composition here..." oninput="Exam.saveAnswer('${q.id}', this.value); document.getElementById('${wordCountId}').textContent=Exam.wordCount(this.value)">${escapeHtml(saved)}</textarea>`;
        body += `<div class="hint">Word count: <span id="${wordCountId}">${saved?saved.trim().split(/\s+/).filter(Boolean).length:0}</span> / ${q.suggested_words||'—'} (min ${q.min_words||0}, max ${q.max_words||'—'})</div>`;
        if(q.rubric) body += `<div class="alert alert-info t-small mt1"><b>Marking guide (teacher):</b> ${escapeHtml(q.rubric)}</div>`;
        break;
      }
      case 'PICTURE': {
        // Like MCQ but media already shown
        const opts = q.options.map((o)=>`
          <label class="option-row" data-opt="${escapeHtml(o)}">
            <input type="radio" name="${aid}" value="${escapeHtml(o)}" ${savedAnswer===o?'checked':''}>
            <span>${escapeHtml(o)}</span>
          </label>`).join('');
        body += opts;
        bind = ()=>{ document.querySelectorAll(`[data-opt]`).forEach(el=>{
          el.addEventListener('click', ()=>{ const inp=el.querySelector('input'); inp.checked=true; el.classList.add('selected'); document.querySelectorAll(`[data-opt]`).forEach(x=>x!==el&&x.classList.remove('selected')); Exam.saveAnswer(q.id, inp.value); });
        });
        const cur = document.querySelector(`input[name="${aid}"]:checked`);
        if(cur) cur.closest('.option-row').classList.add('selected');
        };
        break;
      }
      case 'READING': {
        // Passage already shown; remainder may be MCQ or SHORT
        if(q.options){
          const opts = q.options.map((o)=>`
            <label class="option-row" data-opt="${escapeHtml(o)}">
              <input type="radio" name="${aid}" value="${escapeHtml(o)}" ${savedAnswer===o?'checked':''}>
              <span>${escapeHtml(o)}</span>
            </label>`).join('');
          body += opts;
          bind = ()=>{ document.querySelectorAll(`[data-opt]`).forEach(el=>{
            el.addEventListener('click', ()=>{ const inp=el.querySelector('input'); inp.checked=true; el.classList.add('selected'); document.querySelectorAll(`[data-opt]`).forEach(x=>x!==el&&x.classList.remove('selected')); Exam.saveAnswer(q.id, inp.value); });
          });
          const cur = document.querySelector(`input[name="${aid}"]:checked`);
          if(cur) cur.closest('.option-row').classList.add('selected');
          };
        } else {
          const saved = Array.isArray(savedAnswer)? savedAnswer.join(', ') : (savedAnswer||'');
          body += `<textarea class="input" data-short placeholder="Write your answer here..." oninput="Exam.saveAnswer('${q.id}', this.value)">${escapeHtml(saved)}</textarea>`;
          if(q.rubric) body += `<div class="alert alert-info t-small mt1"><b>Marking guide (teacher):</b> ${escapeHtml(q.rubric)}</div>`;
        }
        break;
      }
      default:
        body += `<div class="alert alert-warn">Unsupported question type: ${escapeHtml(q.type)}</div>`;
    }
    body += `<div class="t-tiny t-muted mt1">Marks: ${q.marks} · Type: ${Q_TYPES[q.type]?.label||q.type}</div>`;
    return { html: body, bind };
  },

  // Auto-marker (objective questions)
  autoMark(q, answer){
    if(!q.auto_markable) return { pending:true };
    switch(q.type){
      case 'MCQ':
      case 'PICTURE': {
        const ok = answer===q.correct;
        return { correct:ok, awarded:ok?q.marks:0, max:q.marks };
      }
      case 'TRUE_FALSE': {
        const ok = String(answer)===String(q.correct);
        return { correct:ok, awarded:ok?q.marks:0, max:q.marks };
      }
      case 'FILL': {
        const arr = Array.isArray(answer)? answer : (answer?[answer]:[]);
        let correctCount=0;
        for(let i=0;i<(q.blanks||1);i++){
          const ans = (arr[i]||'').trim();
          const accepted = (q.accepted_answers?.[i]||[]).map(a=> q.case_sensitive? a : a.toLowerCase());
          const user = q.case_sensitive? ans : ans.toLowerCase();
          if(accepted.includes(user)) correctCount++;
        }
        const total = q.blanks||1;
        if(q.partial_marking || total===1){
          return { correct: correctCount===total, awarded: (q.marks/total)*correctCount, max:q.marks, note:`${correctCount}/${total} blanks correct` };
        } else {
          const ok = correctCount===total;
          return { correct:ok, awarded: ok?q.marks:0, max:q.marks };
        }
      }
      case 'MATCHING': {
        const ans = answer||{};
        let correct=0;
        q.left_items.forEach(l=>{ if(ans[l]===q.correct_pairs[l]) correct++; });
        const total = q.left_items.length;
        if(q.partial_marking){
          return { correct: correct===total, awarded: (q.marks/total)*correct, max:q.marks, note:`${correct}/${total} matched` };
        } else {
          const ok = correct===total;
          return { correct:ok, awarded: ok?q.marks:0, max:q.marks };
        }
      }
      case 'SHORT':
      case 'READING': {
        if(q.auto_markable && q.accepted_answers){
          const ans = (Array.isArray(answer)? answer.join(' ') : String(answer||'')).trim();
          const user = q.case_sensitive? ans : ans.toLowerCase();
          const accepted = q.accepted_answers.flat().map(a=> q.case_sensitive? a : a.toLowerCase());
          // For multi-blank short answers, accept if any accepted answer appears
          const ok = accepted.some(a=> user.includes(a));
          return { correct:ok, awarded: ok?q.marks:0, max:q.marks };
        }
        return { pending:true };
      }
      default:
        return { pending:true };
    }
  }
};

/* ============================================================
   EXAM RUNTIME (start / take / save / submit)
   ============================================================ */
const Exam = {
  _state:{ attemptId:null, questions:[], currentIndex:0, flagged:new Set() },

  collectBlanks(refInput){
    const wraps = refInput.closest('.modal-body, .page, #app, body').querySelectorAll('[data-blank]');
    // fallback: collect all blanks on page (works because single question per page)
    const arr=[];
    document.querySelectorAll('[data-blank]').forEach(el=> arr[parseInt(el.dataset.blank)] = el.value);
    return arr;
  },
  collectMatches(){
    const obj={};
    document.querySelectorAll('[data-match]').forEach(el=> obj[el.dataset.match] = el.value);
    return obj;
  },
  wordCount(text){ return (text||'').trim().split(/\s+/).filter(Boolean).length; },

  // Find or create an in-progress attempt
  async startAttempt(examId, studentId){
    const exam = DB.find('exams', examId);
    if(!exam) return { ok:false, msg:'Examination not found.' };
    if(exam.status!=='PUBLISHED') return { ok:false, msg:'This examination is not currently published.' };
    const now = Date.now();
    if(now < new Date(exam.opens_at).getTime()) return { ok:false, msg:'This examination has not opened yet.' };
    if(now > new Date(exam.closes_at).getTime()) return { ok:false, msg:'This examination has closed.' };

    // Check existing in-progress attempt (from cache)
    let att = DB.firstWhere('attempts', a=> a.exam_id===examId && a.student_id===studentId && a.status==='IN_PROGRESS');
    if(att){
      return { ok:true, attempt:att, resumed:true };
    }
    // Check attempts allowed
    const past = DB.findWhere('attempts', a=> a.exam_id===examId && a.student_id===studentId).length;
    if(past >= (exam.attempts_allowed||1)) return { ok:false, msg:'You have used all allowed attempts for this examination.' };

    if(DB.mode==='supabase' && SB.client){
      // Server-authoritative attempt creation via RPC
      const { data, error } = await SB.client.rpc('exam_start_attempt', {
        p_exam_id: examId, p_student_id: studentId
      });
      if(error) return { ok:false, msg:'Could not start examination: '+(error.message||'') };
      if(!data || data.length===0) return { ok:false, msg:'Could not start examination.' };
      const row = data[0];
      if(!row.attempt_id) return { ok:false, msg: row.msg||'Could not start examination.' };
      // Fetch the full attempt row and add to cache
      const { data: fullAtt } = await SB.client.from(TABLE_MAP.attempts).select('*').eq('id', row.attempt_id).single();
      if(fullAtt){
        att = DB.insertCacheOnly('attempts', fullAtt);
        return { ok:true, attempt:att, resumed: row.resumed };
      }
      return { ok:false, msg:'Attempt created but could not be loaded.' };
    }
    // Local mode: create directly
    const startsAt = Date.now();
    const deadline = startsAt + exam.duration_minutes*60*1000;
    att = DB.insert('attempts', {
      exam_id:examId, student_id:studentId, class_id:DB.find('students',studentId).class_id,
      started_at:new Date(startsAt).toISOString(),
      deadline_at:new Date(deadline).toISOString(),
      duration_minutes:exam.duration_minutes,
      timing_policy:exam.timing_policy,
      status:'IN_PROGRESS', submission_reason:null,
      auto_marks:0, manual_marks:0, total_marks:0, max_marks:exam.total_marks,
      teacher_feedback:null, approved:false, published:false, approved_by:null, approved_at:null
    });
    DB.audit('ATTEMPT_START', studentId, 'student', { exam_id:examId, attempt_id:att.id });
    return { ok:true, attempt:att, resumed:false };
  },

  saveAnswer(questionId, value){
    if(!this._state.attemptId) return;
    const att = DB.find('attempts', this._state.attemptId);
    if(!att || att.status!=='IN_PROGRESS') return;
    // Server check: deadline must not be passed
    if(Timer.remaining(att.id) <= 0){
      this.autoSubmit(att.id, 'TIME_EXPIRED');
      return;
    }
    // Optimistic cache update only — actual persistence goes through
    // the save_student_answer RPC (RLS blocks direct writes by students)
    let ans = DB.firstWhere('answers', a=> a.attempt_id===att.id && a.question_id===questionId);
    if(ans){
      DB.updateCacheOnly('answers', ans.id, { value, saved_at:nowISO() });
    } else {
      ans = DB.insertCacheOnly('answers', { attempt_id:att.id, question_id:questionId, value, saved_at:nowISO() });
    }
    this._refreshPill(questionId);
    this._refreshAnsweredCount();
    // In Supabase mode, persist via the save_student_answer RPC
    if(DB.mode==='supabase' && SB.client){
      SB.client.rpc('save_student_answer', {
        p_attempt_id: att.id,
        p_question_id: questionId,
        p_value: value===null?null:JSON.stringify(value)
      }).then(({data, error})=>{
        if(error){ console.warn('Answer sync failed:', error); return; }
        if(data && data.ok===false){
          if(data.msg && data.msg.includes('expired')){
            toast('Time expired. Submitting...','warn');
            this.autoSubmit(att.id, 'TIME_EXPIRED');
          }
        }
      }).catch(e=>console.warn('Answer sync error:', e));
    }
  },

  _refreshPill(qid){
    const idx = this._state.questions.findIndex(q=>q.id===qid);
    if(idx<0) return;
    const pill = document.querySelector(`.q-pill[onclick*="${idx}"]`);
    if(!pill) return;
    const a = this.loadAnswer(qid);
    const hasAns = a!==null && a!=='' && !(typeof a==='object'&&Object.keys(a).length===0);
    pill.classList.toggle('answered', hasAns);
  },
  _refreshAnsweredCount(){
    const el = document.querySelector('.q-nav + .t-small, [class*="Answered"]');
    if(!el) return;
    const answered = this._state.questions.filter(qq=>{
      const a = this.loadAnswer(qq.id);
      return a!==null && a!=='' && !(typeof a==='object'&&Object.keys(a).length===0);
    }).length;
    // Update the answered counter text
    const counters = document.querySelectorAll('.t-small.t-muted');
    counters.forEach(c=>{ if(c.textContent && c.textContent.includes('Answered:')) c.textContent = `Answered: ${answered} / ${this._state.questions.length}`; });
  },

  loadAnswer(questionId){
    const ans = DB.firstWhere('answers', a=> a.attempt_id===this._state.attemptId && a.question_id===questionId);
    return ans? ans.value : null;
  },

  flag(qid){ this._state.flagged.has(qid)? this._state.flagged.delete(qid) : this._state.flagged.add(qid); },

  // Auto-submit (server-side equivalent would be a Supabase RPC + cron)
  autoSubmit(attemptId, reason){
    const att = DB.find('attempts', attemptId);
    if(!att || att.status!=='IN_PROGRESS') return;
    this._doSubmit(att, reason);
  },

  manualSubmit(attemptId){
    const att = DB.find('attempts', attemptId);
    if(!att || att.status!=='IN_PROGRESS') return false;
    this._doSubmit(att, 'STUDENT_SUBMITTED');
    return true;
  },

  _doSubmit(att, reason){
    const exam = DB.find('exams', att.exam_id);
    const questions = DB.findWhere('questions', q=> q.exam_id===att.exam_id).sort((a,b)=>a.order-b.order);
    let autoMarks = 0, pendingManual=false;
    const answerMarks = [];
    // Compute auto-marks client-side (deterministic for objective questions)
    questions.forEach(q=>{
      const ans = DB.firstWhere('answers', a=> a.attempt_id===att.id && a.question_id===q.id);
      const val = ans? ans.value : null;
      const res = Q.autoMark(q, val);
      if(res.pending){ pendingManual=true; }
      else { autoMarks += res.awarded||0; }
      // Cache-only update (the RPC persists in Supabase mode)
      if(ans){
        DB.updateCacheOnly('answers', ans.id, { auto_result:res, awarded:res.awarded||0, marked: !res.pending });
      } else {
        DB.insertCacheOnly('answers', { attempt_id:att.id, question_id:q.id, value:null, saved_at:nowISO(), auto_result:res, awarded:res.awarded||0, marked:!res.pending });
      }
      answerMarks.push({
        question_id: q.id,
        awarded: res.awarded||0,
        marked: !res.pending,
        auto_result: res
      });
    });
    const newStatus = pendingManual? 'AWAITING_MARKING' : 'MARKED';
    // Cache-only update for the attempt
    DB.updateCacheOnly('attempts', att.id, {
      status: newStatus,
      submitted_at: nowISO(),
      submission_reason: reason,
      auto_marks: autoMarks,
      total_marks: autoMarks
    });
    Timer.stop();
    // In Supabase mode, persist via the student_submit_attempt RPC
    // (RLS blocks students from updating attempts/answers directly)
    if(DB.mode==='supabase' && SB.client){
      SB.client.rpc('student_submit_attempt', {
        p_attempt_id: att.id,
        p_reason: reason,
        p_auto_marks: autoMarks,
        p_answer_marks: answerMarks
      }).then(({data, error})=>{
        if(error){ console.error('Submit RPC failed:', error); toast('Submit sync failed: '+(error.message||''), 'error'); return; }
        if(data && data.ok===false){ console.warn('Submit rejected:', data.msg); }
      }).catch(e=>console.error('Submit error:', e));
    } else {
      // Local mode: audit log
      DB.audit('ATTEMPT_SUBMIT', att.student_id, 'student', { attempt_id:att.id, reason, auto_marks:autoMarks });
    }
  },

  // Teacher marks a single answer
  teacherMark(answerId, awarded, feedback){
    const a = DB.find('answers', answerId);
    if(!a) return;
    DB.update('answers', a.id, { awarded, teacher_feedback:feedback, marked:true, marked_by:Auth.current().id, marked_at:nowISO() });
    // Recompute attempt totals
    this._recomputeAttempt(a.attempt_id);
  },

  _recomputeAttempt(attemptId){
    const att = DB.find('attempts', attemptId);
    if(!att) return;
    const answers = DB.findWhere('answers', a=> a.attempt_id===attemptId);
    const total = answers.reduce((s,a)=> s+(a.awarded||0), 0);
    const allMarked = answers.every(a=> a.marked);
    DB.update('attempts', attemptId, {
      total_marks: total,
      status: allMarked? 'MARKED' : 'AWAITING_MARKING'
    });
  },

  approve(attemptId, approved, feedback){
    const att = DB.find('attempts', attemptId);
    if(!att) return;
    const sess = Auth.current();
    DB.update('attempts', attemptId, {
      approved, approved_by: sess.id, approved_at: nowISO(),
      teacher_feedback: feedback,
      status: approved? 'APPROVED' : 'REJECTED'
    });
    DB.audit(approved?'RESULT_APPROVE':'RESULT_REJECT', sess.id, sess.role, { attempt_id:attemptId });
  },

  publish(attemptId){
    const att = DB.find('attempts', attemptId);
    if(!att) return;
    if(!att.approved){ toast('Result must be approved before publishing.','warn'); return; }
    DB.update('attempts', att.id, { published:true, status:'PUBLISHED', published_at:nowISO() });
    DB.audit('RESULT_PUBLISH', Auth.current().id, Auth.current().role, { attempt_id:attemptId });
  },

  publishBulk(attemptIds){
    attemptIds.forEach(id=> this.publish(id));
  },

  // Teacher edits are blocked once any attempt exists
  canEditExam(examId){
    const attempts = DB.findWhere('attempts', a=> a.exam_id===examId);
    return attempts.length===0;
  }
};

/* ---------- STUDENT DASHBOARD ---------- */
Views.studentDashboard = ()=>{
  const sess = Auth.current();
  const stu = DB.find('students', sess.id);
  if(!stu){ toast('Student record missing.','error'); Auth.logout(); return; }
  // Exams visible to this student's class
  const exams = DB.findWhere('exams', e=> e.class_id===stu.class_id);
  const now = Date.now();
  const byStatus = (e)=>{
    const att = DB.firstWhere('attempts', a=> a.exam_id===e.id && a.student_id===stu.id);
    if(att && att.status==='IN_PROGRESS') return 'in_progress';
    if(att && ['SUBMITTED','AWAITING_MARKING','MARKED','APPROVED'].includes(att.status)) return 'awaiting';
    if(att && att.status==='PUBLISHED') return 'published';
    if(att && att.status==='REJECTED') return 'rejected';
    if(e.status!=='PUBLISHED') return 'draft';
    if(now < new Date(e.opens_at).getTime()) return 'upcoming';
    if(now > new Date(e.closes_at).getTime()) return 'closed';
    return 'available';
  };
  const card = (e)=>{
    const st = byStatus(e);
    const att = DB.firstWhere('attempts', a=> a.exam_id===e.id && a.student_id===stu.id);
    const badge = {
      available:['badge-green','Available'],
      upcoming:['badge-blue','Upcoming'],
      in_progress:['badge-yellow','In progress'],
      awaiting:['badge-yellow','Awaiting approval'],
      published:['badge-green','Results published'],
      rejected:['badge-red','Rejected'],
      closed:['badge-gray','Closed'],
      draft:['badge-gray','Not published']
    }[st];
    let action='';
    if(st==='available') action=`<a href="#/exam/start/${e.id}" class="btn btn-primary btn-sm">Start examination</a>`;
    else if(st==='in_progress') action=`<a href="#/exam/take/${att.id}" class="btn btn-warn btn-sm">Resume</a>`;
    else if(st==='published') action=`<a href="#/result/${att.id}" class="btn btn-ghost btn-sm">View results</a>`;
    else if(st==='awaiting') action=`<span class="t-muted t-small">Awaiting teacher approval</span>`;
    return `<div class="card hover">
      <div class="flex-between">
        <h3>${escapeHtml(e.title)}</h3>
        <span class="badge ${badge[0]}">${badge[1]}</span>
      </div>
      <div class="sub mb1">${escapeHtml(e.subject)} · ${escapeHtml(clsName(e.class_id))} · ${escapeHtml(e.category)}</div>
      <div class="t-small t-muted">
        Opens: ${fmtDate(e.opens_at)}<br>
        Duration: ${e.duration_minutes} min · Total: ${e.total_marks} marks · Pass: ${e.pass_mark||'—'}
      </div>
      <div class="mt1">${action}</div>
    </div>`;
  };
  const avail = exams.filter(e=>byStatus(e)==='available');
  const inProg = exams.filter(e=>byStatus(e)==='in_progress');
  const upcoming = exams.filter(e=>byStatus(e)==='upcoming');
  const awaiting = exams.filter(e=>byStatus(e)==='awaiting');
  const published = exams.filter(e=>byStatus(e)==='published');

  Views.shell(`
    <div class="page">
      <div class="card mb2" style="background:linear-gradient(135deg,var(--green-700),var(--green-600));color:#fff;border:none">
        <div class="flex-between">
          <div>
            <div class="t-tiny" style="opacity:.85">Karibu / Welcome</div>
            <h2 style="margin:.2rem 0;color:#fff">${escapeHtml(stu.name)}</h2>
            <div style="opacity:.9">Admission ${escapeHtml(stu.admission_number)} · ${escapeHtml(clsName(stu.class_id))}</div>
          </div>
          <div class="avatar" style="width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.4rem">${initials(stu.name)}</div>
        </div>
      </div>

      ${inProg.length?`<h3 class="mb1">Continue examination</h3><div class="grid grid-2 mb2">${inProg.map(card).join('')}</div>`:''}
      ${avail.length?`<h3 class="mb1">Available now</h3><div class="grid grid-2 mb2">${avail.map(card).join('')}</div>`:''}
      ${upcoming.length?`<h3 class="mb1">Upcoming</h3><div class="grid grid-2 mb2">${upcoming.map(card).join('')}</div>`:''}
      ${awaiting.length?`<h3 class="mb1">Awaiting teacher approval</h3><div class="grid grid-2 mb2">${awaiting.map(card).join('')}</div>`:''}
      ${published.length?`<h3 class="mb1">Results published</h3><div class="grid grid-2 mb2">${published.map(card).join('')}</div>`:''}

      ${!exams.length?`<div class="empty"><div class="ico">📭</div><h3>No examinations yet</h3><p>When your teacher publishes an examination, it will appear here.</p></div>`:''}
    </div>`);
};

/* ---------- EXAM TAKE ---------- */
Views.examTake = (attemptId)=>{
  const att = DB.find('attempts', attemptId);
  if(!att){ toast('Attempt not found.','error'); return; }
  if(att.student_id !== Auth.current().id){ toast('This is not your examination.','error'); return; }
  if(att.status!=='IN_PROGRESS'){
    if(att.status==='SUBMITTED'||att.status==='AWAITING_MARKING'||att.status==='MARKED'||att.status==='APPROVED'||att.status==='PUBLISHED'){
      location.hash = `#/result/${att.id}`; return;
    }
    toast('This examination can no longer be taken.','warn'); location.hash='#/dashboard'; return;
  }
  // Server-authoritative deadline check
  if(Timer.remaining(att.id) <= 0){
    Exam.autoSubmit(att.id, 'TIME_EXPIRED');
    toast('Time has expired. Your examination has been submitted automatically.','warn');
    location.hash = `#/result/${att.id}`; return;
  }
  const exam = DB.find('exams', att.exam_id);
  let questions = DB.findWhere('questions', q=> q.exam_id===att.exam_id).sort((a,b)=>a.order-b.order);
  if(questions.length===0){
    // Edge case: exam has no questions. Auto-submit with note and send to result page.
    toast('This examination has no questions. Contact your teacher.','warn');
    Exam._doSubmit(att, 'ADMIN_FORCED');
    location.hash = `#/result/${att.id}`;
    return;
  }
  if(exam.randomize_questions){ questions = questions.slice().sort(()=>Math.random()-0.5); }
  Exam._state = { attemptId, questions, currentIndex:0, flagged:new Set() };

  Views._examRender();
  // Start server-authoritative timer display
  Timer.start(att.id,
    (sec)=>{ const el=document.getElementById('timer-val'); if(el){ el.textContent=Timer.fmt(sec); el.className='timer '+(sec<60?'danger':sec<300?'warn':''); } },
    ()=>{ Exam.autoSubmit(att.id,'TIME_EXPIRED'); toast('Time expired. Submitted automatically.','warn'); location.hash=`#/result/${att.id}`; }
  );

  // Heartbeat: every 10s verify deadline (server-side equivalent)
  if(!window._examHeartbeat){
    window._examHeartbeat = setInterval(()=>{
      const cur = DB.find('attempts', Exam._state.attemptId);
      if(!cur || cur.status!=='IN_PROGRESS'){ window._examHeartbeat&&clearInterval(window._examHeartbeat); window._examHeartbeat=null; return; }
      if(Timer.remaining(cur.id)<=0){ clearInterval(window._examHeartbeat); window._examHeartbeat=null; Exam.autoSubmit(cur.id,'TIME_EXPIRED'); toast('Time expired. Submitted.','warn'); location.hash=`#/result/${cur.id}`; }
    }, 10000);
  }
};

Views._examRender = ()=>{
  const att = DB.find('attempts', Exam._state.attemptId);
  const exam = DB.find('exams', att.exam_id);
  const idx = Exam._state.currentIndex;
  const q = Exam._state.questions[idx];
  const saved = Exam.loadAnswer(q.id);
  const r = Q.render(q, att.id, saved);
  const answeredCount = Exam._state.questions.filter(qq=> Exam.loadAnswer(qq.id)!==null && Exam.loadAnswer(qq.id)!=='').length;
  document.getElementById('app').innerHTML = `
    <div class="exam-topbar no-print">
      <div class="t-bold t-small hide-sm">${escapeHtml(exam.title)}</div>
      <div class="spacer"></div>
      <div id="timer-val" class="timer">--:--</div>
      <button class="btn btn-danger btn-sm" onclick="Views._examSubmitConfirm()">Submit</button>
    </div>
    <div class="page">
      <div class="grid" style="grid-template-columns:1fr 240px; gap:1rem">
        <div class="card">
          <div class="flex-between mb1">
            <span class="badge badge-gray">Question ${idx+1} of ${Exam._state.questions.length}</span>
            <button class="btn btn-ghost btn-sm" onclick="Exam.flag('${q.id}'); Views._examRender()">${Exam._state.flagged.has(q.id)?'★ Flagged':'☆ Flag'}</button>
          </div>
          <div id="q-body">${r.html}</div>
          <div class="divider"></div>
          <div class="flex-between">
            <button class="btn btn-ghost" onclick="Views._examNav(${idx-1})" ${idx===0?'disabled':''}>← Previous</button>
            <button class="btn btn-primary" onclick="Views._examNav(${idx+1})" ${idx===Exam._state.questions.length-1?'disabled':''}>Next →</button>
          </div>
        </div>
        <div class="card no-print" style="height:fit-content">
          <div class="t-bold mb1">Question navigator</div>
          <div class="q-nav mb2">
            ${Exam._state.questions.map((qq,i)=>{
              const a = Exam.loadAnswer(qq.id);
              const hasAns = a!==null && a!=='' && !(typeof a==='object'&&Object.keys(a).length===0);
              return `<div class="q-pill ${hasAns?'answered':''} ${Exam._state.flagged.has(qq.id)?'flagged':''} ${i===idx?'current':''}" onclick="Views._examNav(${i})">${i+1}</div>`;
            }).join('')}
          </div>
          <div class="t-small t-muted">Answered: ${answeredCount} / ${Exam._state.questions.length}</div>
          <div class="divider"></div>
          <div class="t-tiny t-muted">
            Answers save automatically.<br>
            If your phone dies or browser closes, sign in again and resume — your work is preserved.
          </div>
        </div>
      </div>
    </div>`;
  // Re-bind option clicks etc.
  document.querySelectorAll('input,textarea,select').forEach(el=>{
    if(el.dataset.bindDone) return;
  });
  if(r.bind) setTimeout(r.bind, 0);
};

Views._examNav = (i)=>{
  if(i<0 || i>=Exam._state.questions.length) return;
  Exam._state.currentIndex = i;
  Views._examRender();
};

Views._examSubmitConfirm = ()=>{
  const att = DB.find('attempts', Exam._state.attemptId);
  const total = Exam._state.questions.length;
  const answered = Exam._state.questions.filter(qq=>{ const a=Exam.loadAnswer(qq.id); return a!==null && a!=='' && !(typeof a==='object'&&Object.keys(a).length===0); }).length;
  confirmDialog(
    `You have answered ${answered} of ${total} questions. Once submitted, you cannot change your answers. Submit now?`,
    ()=>{ if(Exam.manualSubmit(att.id)){ toast('Examination submitted.','success'); location.hash=`#/result/${att.id}`; } },
    { title:'Submit examination?', danger:false }
  );
};

                const canEdit = Exam.canEditExam(e.id);
                return `<tr>
                  <td>${escapeHtml(e.title)}</td>
                  <td>${escapeHtml(clsName(e.class_id))}</td>
                  <td>${escapeHtml(e.subject)}</td>
                  <td><span class="badge ${e.status==='PUBLISHED'?'badge-green':e.status==='DRAFT'?'badge-gray':'badge-blue'}">${EXAM_STATUS[e.status]}</span></td>
                  <td>${atts.length}</td>
                  <td>
                    <a href="#/exams/edit/${e.id}" class="btn btn-ghost btn-sm">${canEdit?'Edit':'View'}</a>
                    <a href="#/exams/preview/${e.id}" class="btn btn-ghost btn-sm">Preview</a>
                    ${atts.length?`<a href="#/marking" class="btn btn-ghost btn-sm">Marking</a>`:''}
                  </td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>`}
    </div>`);
};

Views._examEditorSubjects = ()=>{
  const sess = Auth.current();

  const assigns = DB.findWhere('teacher_assignments', t=> t.teacher_id===sess.id && t.class_id===cid);

Views._examEditorRenderQuestions = ()=>{
  // We store a transient list in window._editorQuestions
  const examId = location.hash.split('/').pop();
  if(examId && examId!=='new' && DB.find('exams', examId) && !window._editorQuestions){
    window._editorQuestions = DB.findWhere('questions', q=> q.exam_id===examId).sort((a,b)=>a.order-b.order);
  }
  if(!window._editorQuestions) window._editorQuestions = [];
  const list = window._editorQuestions;
  const wrap = document.getElementById('q-list');
  if(list.length===0){
    wrap.innerHTML = `<div class="empty"><div class="ico">❓</div><h3>No questions yet</h3><p>Add your first question.</p><button class="btn btn-primary" onclick="Views._examEditorAddQuestion()">+ Add question</button></div>`;
    return;
  }
  wrap.innerHTML = list.map((q,i)=>`
    <div class="card mb1">
      <div class="flex-between">
        <div><span class="badge badge-gray">Q${i+1}</span> <span class="badge badge-blue">${Q_TYPES[q.type]?.label||q.type}</span> <span class="badge badge-green">${q.marks} marks</span></div>
        <div>
          <button class="btn btn-ghost btn-sm" onclick="Views._examEditorEditQuestion(${i})">Edit</button>
          <button class="btn btn-ghost btn-sm" onclick="Views._examEditorDelQuestion(${i})">Delete</button>
        </div>
      </div>
      <div class="mt1 t-small">${escapeHtml(q.prompt.slice(0,140))}${q.prompt.length>140?'…':''}</div>
    </div>`).join('');
};

Views._examEditorAddQuestion = ()=>{ Views._examEditorEditQuestion(-1); };
Views._examEditorEditQuestion = (idx)=>{
  const types = Object.keys(Q_TYPES);

    <div class="field"><label>Question type</label>
      <select id="q_type" class="input" onchange="Views._qEditorTypeChange()">
        ${types.map(t=>`<option value="${t}" ${q.type===t?'selected':''}>${Q_TYPES[t].label}</option>`).join('')}
      </select>
    </div>
    <div class="field"><label>Marks</label><input id="q_marks" type="number" min="1" class="input" value="${q.marks}"></div>
    <div class="field"><label>Question prompt *</label><textarea id="q_prompt" class="input">${escapeHtml(q.prompt)}</textarea></div>
    <div id="q_type_fields"></div>
    <div class="field"><label>Curriculum level / topic</label>
      <input id="q_topic" class="input" value="${escapeHtml(q.topic||'')}" placeholder="e.g. Fractions — addition">
    </div>
    <button class="btn btn-primary btn-block" onclick="Views._qEditorSave(${idx})">Save question</button>
  `;
